hypothesis: The immutable candidate can be rebuilt on Linux and Windows with the locked environment, contract-equivalent
  artifacts, a fresh manuscript PDF, and fail-closed rejection of every preregistered evidence corruption.
null_or_competitors:
- The passes depend on undeclared builder state or one operating system.
- The semantic artifact checker accepts a preregistered corruption.
- The manuscript cannot be rebuilt from the authoritative TeX source.
known_failure_to_retain: Retain the CA failed headline, perturbed-Bell false geometry, raw-relative-entropy
  source failure, entropy confound, and reduced-modular localization failure.
threat_model:
- undeclared local state
- platform-specific numerical drift
- regeneration without semantic equivalence
- silent check, threshold, shape, configuration, or visual weakening
preregistration:
  parameters:
    candidate_commit: 9a29e05f803666bf0e3a28417ea399e3e26769fc
    candidate_tree: 358fb1af6ca587b6c71ff2ef0fb87e335163eeaf
    dependency_lock: uv.lock
    python_minor: '3.11'
    platform_families:
    - ubuntu-latest-x86_64
    - windows-x86_64
    required_test_count: 187
    required_example_count: 6
    required_mutation_count: 7
    pdf_engine: pdfTeX-1.40.29-TeX-Live-2026
    pdf_pass_count: 2
    native_or_scalable_claim_in_scope: false
    seed_policy: Use committed seeds or the custodian seed; never reselect after output.
  measurement_procedure: In disposable exact-SHA clones, retain environment and raw stdout/stderr for
    isolated environment/cleanliness preflight and postflight checks, locked sync, lint, TeX source validation,
    full tests, six examples, semantic artifact validation, two pdflatex passes, and seven frozen mutations.
  uncertainty_procedure: Command exits, test counts, structure, mutation rejection, PYTHONPATH absence,
    and complete tracked/untracked Git cleanliness are exact. Numeric drift uses only the committed semantic-checker
    tolerances.
  statistical_analysis: Pass only if both platforms succeed at the exact candidate, PYTHONPATH is unset,
    isolated preflight and postflight report no tracked or untracked residue, Windows builds a nonempty PDF,
    regeneration is contract-equivalent, all corruptions are rejected, and no required result exists only
    in an agent summary. Missing commands, surviving mutations, any repository residue, undeclared import
    state, or a platform-only result are failures.
  resource_budget:
    wall_time_seconds: 3600
    memory_bytes: 12884901888
    accelerator_seconds: 0
  commands:
  - "python -I -c \"import os,subprocess,sys; p=subprocess.run(['git','status','--porcelain=v1','--untracked-files=all'],capture_output=True,text=True); sys.stdout.write(p.stdout); sys.stderr.write(p.stderr); blocked=bool(os.environ.get('PYTHONPATH')); sys.stderr.write('PYTHONPATH must be unset\\n' if blocked else ''); raise SystemExit(p.returncode or bool(p.stdout) or blocked)\""
  - uv sync --frozen
  - uv run ruff check .
  - uv run python scripts/check_tex.py
  - uv run pytest -q
  - uv run python -m examples.physics_qg.chain_1d
  - uv run python -m examples.physics_qg.grid_2d
  - uv run python -m examples.physics_qg.gravity_well
  - uv run python -m examples.physics_qg.source_law
  - uv run python -m examples.physics_qg.source_law_many_body
  - uv run python -m examples.physics_qg.ca_model
  - uv run python scripts/check_validation_artifacts.py
  - pdflatex -interaction=nonstopmode -halt-on-error docs/framework.tex
  - git diff --exit-code
  - "uv run python -I -c \"import os,subprocess,sys; p=subprocess.run(['git','status','--porcelain=v1','--untracked-files=all'],capture_output=True,text=True); sys.stdout.write(p.stdout); sys.stderr.write(p.stderr); blocked=bool(os.environ.get('PYTHONPATH')); sys.stderr.write('PYTHONPATH must be unset\\n' if blocked else ''); raise SystemExit(p.returncode or bool(p.stdout) or blocked)\""
  mutation_plan:
  - Add an unregistered noninformational check identity; require rejection.
  - Flip a required check pass outcome; require rejection.
  - Change a measurement array shape; require rejection.
  - Change a stable configuration beyond tolerance; require rejection.
  - Make a required visual empty and untracked; require both defects.
  - Move a sensitive scientific diagnostic beyond its frozen threshold; require rejection.
  - Activate an untracked sitecustomize.py through PYTHONPATH; require isolated preflight or postflight
    rejection.
  protocol_artifacts:
  - receipt_id: protocol
    content_role: primary-protocol
    campaign_path: ../receipts/VIA-000/protocol.json
    protocol_path: protocols/POPGP-VIABILITY-R1-2026-08/VIA-000.json
    sha256: 72ad5dc9b9fa23fb3cd1b46f1fdeef6a6391f1f5a904e5db45cbac5a5030ee70
    media_type: application/json
