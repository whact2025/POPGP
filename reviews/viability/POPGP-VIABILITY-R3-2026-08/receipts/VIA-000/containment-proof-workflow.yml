name: VIA-000 R3 containment proof only

on:
  push:
    branches:
      - campaign/via000-r3-protocol-*
      - review/via000-r3-protocol-*
    paths:
      - .github/workflows/via000-r3-containment-proof.yml
      - protocols/POPGP-VIABILITY-R3-2026-08/VIA-000.json
      - protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT.ps1
      - protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-RUNNER.ps1
      - protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-HOSTILE.ps1
      - protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF.schema.json
      - protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-ENVELOPE.schema.json
      - protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-AGGREGATOR.py
      - reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/**

permissions:
  contents: read

concurrency:
  group: via000-r3-containment-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu-candidate:
    name: proof / ubuntu-latest-x86_64 / candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      ubuntu_candidate_envelope: ${{ steps.proof.outputs.ubuntu_candidate_envelope }}
    steps:
      - &proof-checkout
        name: Checkout frozen proof-only closure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/via000-r3-containment-proof.yml
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000.json
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT.ps1
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-RUNNER.ps1
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-HOSTILE.ps1
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF.schema.json
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-ENVELOPE.schema.json
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-AGGREGATOR.py
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-protocol.ps1
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof-runner.ps1
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof-hostile.ps1
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof.schema.json
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof-envelope.schema.json
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof-aggregator.py
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof-workflow.yml
      -
        name: Prove contained Ubuntu candidate and emit one protected output
        id: proof
        shell: /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        env:
          VIA000_PLATFORM_FAMILY: ubuntu-latest-x86_64
          VIA000_STAGE_ID: candidate
          VIA000_OUTPUT_NAME: ubuntu_candidate_envelope
          VIA000_TRUSTED_POWERSHELL: /opt/microsoft/powershell/7/pwsh
          VIA000_REPOSITORY: ${{ github.repository }}
          VIA000_EVENT_NAME: ${{ github.event_name }}
          VIA000_SOURCE_REF: ${{ github.ref }}
          VIA000_SOURCE_SHA: ${{ github.sha }}
          VIA000_WORKFLOW_REF: ${{ github.workflow_ref }}
          VIA000_RUN_ID: ${{ github.run_id }}
          VIA000_RUN_ATTEMPT: ${{ github.run_attempt }}
          VIA000_RUNNER_TEMP: ${{ runner.temp }}
        run: &ubuntu-proof-run |
          $root = [string]$env:GITHUB_WORKSPACE
          $protocol = Join-Path $root "protocols/POPGP-VIABILITY-R3-2026-08/VIA-000.json"
          $runner = Join-Path $root "protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-RUNNER.ps1"
          $workspace = "/tmp/via000-proof-workspace"
          $output = Join-Path ([string]$env:VIA000_RUNNER_TEMP) "via000-r3-containment-envelope"
          & ([string]$env:VIA000_TRUSTED_POWERSHELL) -NoLogo -NoProfile -NonInteractive -File $runner `
            -PlatformFamily ([string]$env:VIA000_PLATFORM_FAMILY) `
            -StageId ([string]$env:VIA000_STAGE_ID) -RepoRoot $root `
            -ProtocolPath $protocol -WorkspaceRoot $workspace `
            -RunnerTemp ([string]$env:VIA000_RUNNER_TEMP) -OutputRoot $output `
            -PowerShellPath ([string]$env:VIA000_TRUSTED_POWERSHELL) `
            -Repository ([string]$env:VIA000_REPOSITORY) `
            -EventName ([string]$env:VIA000_EVENT_NAME) -SourceRef ([string]$env:VIA000_SOURCE_REF) `
            -SourceSha ([string]$env:VIA000_SOURCE_SHA) -WorkflowRef ([string]$env:VIA000_WORKFLOW_REF) `
            -RunId ([string]$env:VIA000_RUN_ID) -RunAttempt ([string]$env:VIA000_RUN_ATTEMPT) `
            -OutputName ([string]$env:VIA000_OUTPUT_NAME)
          if ($LASTEXITCODE -ne 0) { throw "containment proof cell failed" }

  ubuntu-pdf:
    name: proof / ubuntu-latest-x86_64 / pdf
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      ubuntu_pdf_envelope: ${{ steps.proof.outputs.ubuntu_pdf_envelope }}
    steps:
      - *proof-checkout
      - name: Prove contained Ubuntu pdf and emit one protected output
        id: proof
        shell: /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        env:
          VIA000_PLATFORM_FAMILY: ubuntu-latest-x86_64
          VIA000_STAGE_ID: pdf
          VIA000_OUTPUT_NAME: ubuntu_pdf_envelope
          VIA000_TRUSTED_POWERSHELL: /opt/microsoft/powershell/7/pwsh
          VIA000_REPOSITORY: ${{ github.repository }}
          VIA000_EVENT_NAME: ${{ github.event_name }}
          VIA000_SOURCE_REF: ${{ github.ref }}
          VIA000_SOURCE_SHA: ${{ github.sha }}
          VIA000_WORKFLOW_REF: ${{ github.workflow_ref }}
          VIA000_RUN_ID: ${{ github.run_id }}
          VIA000_RUN_ATTEMPT: ${{ github.run_attempt }}
          VIA000_RUNNER_TEMP: ${{ runner.temp }}
        run: *ubuntu-proof-run

  ubuntu-mutation:
    name: proof / ubuntu-latest-x86_64 / mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      ubuntu_mutation_envelope: ${{ steps.proof.outputs.ubuntu_mutation_envelope }}
    steps:
      - *proof-checkout
      - name: Prove contained Ubuntu mutation and emit one protected output
        id: proof
        shell: /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        env:
          VIA000_PLATFORM_FAMILY: ubuntu-latest-x86_64
          VIA000_STAGE_ID: mutation
          VIA000_OUTPUT_NAME: ubuntu_mutation_envelope
          VIA000_TRUSTED_POWERSHELL: /opt/microsoft/powershell/7/pwsh
          VIA000_REPOSITORY: ${{ github.repository }}
          VIA000_EVENT_NAME: ${{ github.event_name }}
          VIA000_SOURCE_REF: ${{ github.ref }}
          VIA000_SOURCE_SHA: ${{ github.sha }}
          VIA000_WORKFLOW_REF: ${{ github.workflow_ref }}
          VIA000_RUN_ID: ${{ github.run_id }}
          VIA000_RUN_ATTEMPT: ${{ github.run_attempt }}
          VIA000_RUNNER_TEMP: ${{ runner.temp }}
        run: *ubuntu-proof-run

  windows-candidate:
    name: proof / windows-x86_64 / candidate
    runs-on: windows-2025
    timeout-minutes: 12
    outputs:
      windows_candidate_envelope: ${{ steps.proof.outputs.windows_candidate_envelope }}
    steps:
      - *proof-checkout
      -
        name: Prove contained Windows candidate and emit one protected output
        id: proof
        shell: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command ". '{0}'"
        env:
          VIA000_PLATFORM_FAMILY: windows-x86_64
          VIA000_STAGE_ID: candidate
          VIA000_OUTPUT_NAME: windows_candidate_envelope
          VIA000_TRUSTED_POWERSHELL: C:\Program Files\PowerShell\7\pwsh.exe
          VIA000_REPOSITORY: ${{ github.repository }}
          VIA000_EVENT_NAME: ${{ github.event_name }}
          VIA000_SOURCE_REF: ${{ github.ref }}
          VIA000_SOURCE_SHA: ${{ github.sha }}
          VIA000_WORKFLOW_REF: ${{ github.workflow_ref }}
          VIA000_RUN_ID: ${{ github.run_id }}
          VIA000_RUN_ATTEMPT: ${{ github.run_attempt }}
          VIA000_RUNNER_TEMP: ${{ runner.temp }}
        run: &windows-proof-run |
          $root = [string]$env:GITHUB_WORKSPACE
          $protocol = Join-Path $root "protocols/POPGP-VIABILITY-R3-2026-08/VIA-000.json"
          $runner = Join-Path $root "protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-RUNNER.ps1"
          $workspace = Join-Path $root "via000-proof-workspace"
          $output = Join-Path ([string]$env:VIA000_RUNNER_TEMP) "via000-r3-containment-envelope"
          & ([string]$env:VIA000_TRUSTED_POWERSHELL) -NoLogo -NoProfile -NonInteractive -File $runner `
            -PlatformFamily ([string]$env:VIA000_PLATFORM_FAMILY) `
            -StageId ([string]$env:VIA000_STAGE_ID) -RepoRoot $root `
            -ProtocolPath $protocol -WorkspaceRoot $workspace `
            -RunnerTemp ([string]$env:VIA000_RUNNER_TEMP) -OutputRoot $output `
            -PowerShellPath ([string]$env:VIA000_TRUSTED_POWERSHELL) `
            -Repository ([string]$env:VIA000_REPOSITORY) `
            -EventName ([string]$env:VIA000_EVENT_NAME) -SourceRef ([string]$env:VIA000_SOURCE_REF) `
            -SourceSha ([string]$env:VIA000_SOURCE_SHA) -WorkflowRef ([string]$env:VIA000_WORKFLOW_REF) `
            -RunId ([string]$env:VIA000_RUN_ID) -RunAttempt ([string]$env:VIA000_RUN_ATTEMPT) `
            -OutputName ([string]$env:VIA000_OUTPUT_NAME)
          if ($LASTEXITCODE -ne 0) { throw "containment proof cell failed" }

  windows-pdf:
    name: proof / windows-x86_64 / pdf
    runs-on: windows-2025
    timeout-minutes: 12
    outputs:
      windows_pdf_envelope: ${{ steps.proof.outputs.windows_pdf_envelope }}
    steps:
      - *proof-checkout
      - name: Prove contained Windows pdf and emit one protected output
        id: proof
        shell: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command ". '{0}'"
        env:
          VIA000_PLATFORM_FAMILY: windows-x86_64
          VIA000_STAGE_ID: pdf
          VIA000_OUTPUT_NAME: windows_pdf_envelope
          VIA000_TRUSTED_POWERSHELL: C:\Program Files\PowerShell\7\pwsh.exe
          VIA000_REPOSITORY: ${{ github.repository }}
          VIA000_EVENT_NAME: ${{ github.event_name }}
          VIA000_SOURCE_REF: ${{ github.ref }}
          VIA000_SOURCE_SHA: ${{ github.sha }}
          VIA000_WORKFLOW_REF: ${{ github.workflow_ref }}
          VIA000_RUN_ID: ${{ github.run_id }}
          VIA000_RUN_ATTEMPT: ${{ github.run_attempt }}
          VIA000_RUNNER_TEMP: ${{ runner.temp }}
        run: *windows-proof-run

  windows-mutation:
    name: proof / windows-x86_64 / mutation
    runs-on: windows-2025
    timeout-minutes: 12
    outputs:
      windows_mutation_envelope: ${{ steps.proof.outputs.windows_mutation_envelope }}
    steps:
      - *proof-checkout
      - name: Prove contained Windows mutation and emit one protected output
        id: proof
        shell: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -Command ". '{0}'"
        env:
          VIA000_PLATFORM_FAMILY: windows-x86_64
          VIA000_STAGE_ID: mutation
          VIA000_OUTPUT_NAME: windows_mutation_envelope
          VIA000_TRUSTED_POWERSHELL: C:\Program Files\PowerShell\7\pwsh.exe
          VIA000_REPOSITORY: ${{ github.repository }}
          VIA000_EVENT_NAME: ${{ github.event_name }}
          VIA000_SOURCE_REF: ${{ github.ref }}
          VIA000_SOURCE_SHA: ${{ github.sha }}
          VIA000_WORKFLOW_REF: ${{ github.workflow_ref }}
          VIA000_RUN_ID: ${{ github.run_id }}
          VIA000_RUN_ATTEMPT: ${{ github.run_attempt }}
          VIA000_RUNNER_TEMP: ${{ runner.temp }}
        run: *windows-proof-run

  aggregate:
    name: consolidate exact six job outputs on Ubuntu
    if: always()
    needs:
      - ubuntu-candidate
      - ubuntu-pdf
      - ubuntu-mutation
      - windows-candidate
      - windows-pdf
      - windows-mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: Require all six explicit proof jobs
        env:
          VIA000_JOB_RESULTS: ${{ join(needs.*.result, ',') }}
        shell: /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        run: |
          $results = ([string]$env:VIA000_JOB_RESULTS).Split(',')
          if ($results.Count -ne 6 -or @($results | Where-Object { $_ -cne 'success' }).Count -ne 0) {
            throw "one or more explicit containment proof jobs failed"
          }
      - name: Checkout frozen aggregate verifier only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/via000-r3-containment-proof.yml
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000.json
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF.schema.json
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-ENVELOPE.schema.json
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-AGGREGATOR.py
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof.schema.json
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof-envelope.schema.json
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof-aggregator.py
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof-workflow.yml
      -
        name: Install exact aggregate Python
        id: aggregate-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.15"
          cache: ""
      - name: Validate six outputs in memory and create seven retained files
        shell: /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        env:
          VIA000_BASE_PYTHON_OUTPUT: ${{ steps.aggregate-python.outputs.python-path }}
          VIA000_SOURCE_REF: ${{ github.ref }}
          VIA000_SOURCE_SHA: ${{ github.sha }}
          VIA000_WORKFLOW_REF: ${{ github.workflow_ref }}
          VIA000_RUN_ID: ${{ github.run_id }}
          VIA000_RUN_ATTEMPT: ${{ github.run_attempt }}
          VIA000_ENVELOPE_UBUNTU_CANDIDATE: ${{ needs.ubuntu-candidate.outputs.ubuntu_candidate_envelope }}
          VIA000_ENVELOPE_UBUNTU_PDF: ${{ needs.ubuntu-pdf.outputs.ubuntu_pdf_envelope }}
          VIA000_ENVELOPE_UBUNTU_MUTATION: ${{ needs.ubuntu-mutation.outputs.ubuntu_mutation_envelope }}
          VIA000_ENVELOPE_WINDOWS_CANDIDATE: ${{ needs.windows-candidate.outputs.windows_candidate_envelope }}
          VIA000_ENVELOPE_WINDOWS_PDF: ${{ needs.windows-pdf.outputs.windows_pdf_envelope }}
          VIA000_ENVELOPE_WINDOWS_MUTATION: ${{ needs.windows-mutation.outputs.windows_mutation_envelope }}
        run: |
          $expected = "/opt/hostedtoolcache/Python/3.11.15/x64/bin/python"
          $python = "/opt/hostedtoolcache/Python/3.11.15/x64/bin/python3.11"
          if ([string]$env:VIA000_BASE_PYTHON_OUTPUT -cne $expected) { throw "aggregate Python path differs" }
          $version = & $python -I -S -c "import platform; print(platform.python_version())"
          if ($LASTEXITCODE -ne 0 -or $version -cne "3.11.15") { throw "aggregate Python differs" }
          $aggregator = Join-Path ([string]$env:GITHUB_WORKSPACE) "protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-AGGREGATOR.py"
          $output = Join-Path ([string]$env:RUNNER_TEMP) "via000-r3-retained-proof"
          & $python -I -S $aggregator --collect-job-outputs --output-root $output `
            --source-sha ([string]$env:VIA000_SOURCE_SHA) --source-ref ([string]$env:VIA000_SOURCE_REF) `
            --workflow-ref ([string]$env:VIA000_WORKFLOW_REF) --run-id ([string]$env:VIA000_RUN_ID) `
            --run-attempt ([string]$env:VIA000_RUN_ATTEMPT)
          if ($LASTEXITCODE -ne 0) { throw "six-output proof consolidation failed" }
      - name: Upload one consolidated non-scientific proof
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: via000-r3-containment-proof-retained
          path: ${{ runner.temp }}/via000-r3-retained-proof
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          retention-days: 7

  verify-retained:
    name: redownload and verify retained seven-file proof
    needs: aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout frozen retained verifier only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-AGGREGATOR.py
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof-aggregator.py
      - name: Install exact verifier Python
        id: verify-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.15"
          cache: ""
      - name: Download the exact consolidated proof artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: via000-r3-containment-proof-retained
          path: ${{ runner.temp }}/via000-r3-retained-proof-download
      - name: Revalidate retained bytes and recorded artifact identity
        shell: /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        env:
          VIA000_BASE_PYTHON_OUTPUT: ${{ steps.verify-python.outputs.python-path }}
          VIA000_ARTIFACT_ID: ${{ needs.aggregate.outputs.artifact_id }}
          VIA000_ARTIFACT_DIGEST: ${{ needs.aggregate.outputs.artifact_digest }}
          VIA000_ARTIFACT_URL: ${{ needs.aggregate.outputs.artifact_url }}
          VIA000_SOURCE_REF: ${{ github.ref }}
          VIA000_SOURCE_SHA: ${{ github.sha }}
          VIA000_WORKFLOW_REF: ${{ github.workflow_ref }}
          VIA000_RUN_ID: ${{ github.run_id }}
          VIA000_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if ([string]$env:VIA000_ARTIFACT_ID -cnotmatch '^[1-9][0-9]*$' -or
              [string]$env:VIA000_ARTIFACT_DIGEST -cnotmatch '^sha256:[0-9a-f]{64}$' -or
              [string]$env:VIA000_ARTIFACT_URL -cnotmatch '^https://github.com/whact2025/POPGP/actions/runs/[1-9][0-9]*/artifacts/[1-9][0-9]*$') {
            throw "retained artifact identity or digest is malformed"
          }
          $expected = "/opt/hostedtoolcache/Python/3.11.15/x64/bin/python"
          $python = "/opt/hostedtoolcache/Python/3.11.15/x64/bin/python3.11"
          if ([string]$env:VIA000_BASE_PYTHON_OUTPUT -cne $expected) { throw "verifier Python path differs" }
          $version = & $python -I -S -c "import platform; print(platform.python_version())"
          if ($LASTEXITCODE -ne 0 -or $version -cne "3.11.15") { throw "verifier Python differs" }
          $aggregator = Join-Path ([string]$env:GITHUB_WORKSPACE) "protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-AGGREGATOR.py"
          $retained = Join-Path ([string]$env:RUNNER_TEMP) "via000-r3-retained-proof-download"
          & $python -I -S $aggregator --verify-retained $retained `
            --source-sha ([string]$env:VIA000_SOURCE_SHA) --source-ref ([string]$env:VIA000_SOURCE_REF) `
            --workflow-ref ([string]$env:VIA000_WORKFLOW_REF) --run-id ([string]$env:VIA000_RUN_ID) `
            --run-attempt ([string]$env:VIA000_RUN_ATTEMPT)
          if ($LASTEXITCODE -ne 0) { throw "retained seven-file proof validation failed" }
