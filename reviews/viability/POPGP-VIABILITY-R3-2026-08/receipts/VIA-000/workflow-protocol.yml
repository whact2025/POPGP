          }
          $env:PATH = ""
          $env:PATHEXT = ""
          Get-ChildItem Env: | Where-Object Name -Like "GIT_*" | ForEach-Object {
            Remove-Item -LiteralPath "Env:$($_.Name)"
          }
          $emptyGitConfig = Join-Path $env:RUNNER_TEMP "via000-r3-empty-gitconfig"
          New-Item -ItemType File -Path $emptyGitConfig -Force | Out-Null
          $env:GIT_NO_REPLACE_OBJECTS = "1"
          $env:GIT_CONFIG_NOSYSTEM = "1"
          $env:GIT_CONFIG_GLOBAL = $emptyGitConfig
          $env:GIT_TERMINAL_PROMPT = "0"
          $workspace = Join-Path $env:RUNNER_TEMP "via000-r3-mutation-stage"
          try {
          $authorizationPath = Join-Path $env:RUNNER_TEMP "via000-r3-authorization.json"
          $authorization = Get-Content -LiteralPath $authorizationPath -Raw | ConvertFrom-Json
          $gitArguments = @(
            "--no-replace-objects", "-C", $env:GITHUB_WORKSPACE,
            "rev-parse", "--verify", "--end-of-options", $authorization.authorization_ref
          )
          $currentAuthorizationTagOid = @(& $trustedGit @gitArguments)
          if ($LASTEXITCODE -ne 0 -or $currentAuthorizationTagOid -ne $authorization.authorization_tag_oid) {
            throw "authorization ref changed before mutation execution"
          }
          $protocolRoot = Join-Path $env:GITHUB_WORKSPACE "protocols/POPGP-VIABILITY-R3-2026-08"
          $mutationRunner = Join-Path $protocolRoot "VIA-000-MUTATION-RUNNER.py"
          $containment = Join-Path $protocolRoot "VIA-000-CONTAINMENT.ps1"
          $protocol = Join-Path $protocolRoot "VIA-000.json"
          $repo = Join-Path $workspace "mutable/candidate"
          $evidence = Join-Path $workspace "evidence"
          $mutable = Join-Path $workspace "mutable"
          $plan = Join-Path $evidence "mutation-plan.json"
          $stdout = Join-Path $evidence "mutation-contained.stdout.txt"
          $stderr = Join-Path $evidence "mutation-contained.stderr.txt"
          $containedResult = Join-Path $evidence "mutation-contained.result.json"
          $identityArguments = @(
            "--repo-root", $repo,
            "--protocol", $protocol,
            "--workspace-root", $workspace,
            "--environment-python", [string]$env:VIA000_ENVIRONMENT_PYTHON,
            "--environment-python-sha256", [string]$env:VIA000_ENVIRONMENT_PYTHON_SHA256,
            "--plan", $plan,
            "--platform-family", $platform,
            "--protocol-source-commit", $authorization.protocol_commit,
            "--dispatch-ref", $authorization.source_ref,
            "--authorization-ref", $authorization.authorization_ref,
            "--authorization-tag-oid", $authorization.authorization_tag_oid,
            "--authorization-commit", $authorization.authorization_commit,
            "--authorization-record-sha256", $authorization.authorization_record_sha256,
            "--producer-run-id", $producerRunId,
            "--producer-run-attempt", $producerRunAttempt
          )
          & $env:VIA000_BASE_PYTHON -I -S $mutationRunner prepare @identityArguments
          if ($LASTEXITCODE -ne 0) { throw "mutation plan preparation failed" }
          $candidatePython = [string]$env:VIA000_ENVIRONMENT_PYTHON
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $candidatePython).Hash.ToLowerInvariant() -cne [string]$env:VIA000_ENVIRONMENT_PYTHON_SHA256) {
            throw "locked environment Python changed before contained mutation execution"
          }
          . $containment
          $systemTools = if ($platform -eq "windows-x86_64") {
            @{}
          } else {
            @{
              sudo = "/usr/bin/sudo"; systemd_run = "/usr/bin/systemd-run"
              systemctl = "/usr/bin/systemctl"; useradd = "/usr/sbin/useradd"
              userdel = "/usr/sbin/userdel"; id = "/usr/bin/id"
            }
          }
          Test-Via000ContainmentAvailability -PlatformFamily $platform -SystemTools $systemTools
          $closure = @{
            $candidatePython = [string]$env:VIA000_ENVIRONMENT_PYTHON_SHA256
            ([string]$env:VIA000_BASE_PYTHON) = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:VIA000_BASE_PYTHON).Hash.ToLowerInvariant()
            $trustedGit = [string]$env:VIA000_GIT_SHA256
            $containment = (Get-FileHash -Algorithm SHA256 -LiteralPath $containment).Hash.ToLowerInvariant()
            $mutationRunner = (Get-FileHash -Algorithm SHA256 -LiteralPath $mutationRunner).Hash.ToLowerInvariant()
            $protocol = (Get-FileHash -Algorithm SHA256 -LiteralPath $protocol).Hash.ToLowerInvariant()
          }
          foreach ($path in $systemTools.Values) {
            $closure[[string]$path] = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
          }
          $prepared = Get-Content -LiteralPath $plan -Raw | ConvertFrom-Json
          Invoke-Via000ContainedCommand -Label "mutation-suite" -ContractId "contained-frozen-mutation-suite" `
            -PlatformFamily $platform -FilePath $candidatePython `
            -Arguments @($prepared.arguments | ForEach-Object { [string]$_ }) `
            -WorkingDirectory ([string]$prepared.working_directory) `
            -MutableRoot $mutable -TrustedRoot $evidence `
            -StdoutPath $stdout -StderrPath $stderr -ResultPath $containedResult `
            -Environment @{
              UV_CACHE_DIR = (Join-Path $mutable "mutation-uv-cache")
              PYTHONPYCACHEPREFIX = (Join-Path $mutable "mutation-python-cache")
              PYTHONDONTWRITEBYTECODE = "1"
              RUFF_CACHE_DIR = (Join-Path $mutable "mutation-ruff-cache")
              MPLCONFIGDIR = (Join-Path $mutable "mutation-matplotlib-cache")
              XDG_CACHE_HOME = (Join-Path $mutable "mutation-general-cache")
            } -Closure $closure -SystemTools $systemTools
          & $env:VIA000_BASE_PYTHON -I -S $mutationRunner finalize @identityArguments `
            --stdout $stdout --stderr $stderr --contained-result $containedResult
          if ($LASTEXITCODE -ne 0) { throw "trusted mutation finalization failed" }
          $containedItem = Get-Item -LiteralPath $containedResult -Force -ErrorAction Stop
          $containedRecord = Get-Content -LiteralPath $containedResult -Raw | ConvertFrom-Json
          if (-not ($containedItem -is [IO.FileInfo]) -or
              ($containedItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
              $containedRecord.descendants_quiescent -ne $true -or
              [int]$containedRecord.active_processes_after_teardown -ne 0 -or
              -not (Test-Path -LiteralPath (Join-Path $evidence "evidence-manifest.json") -PathType Leaf)) {
            throw "mutation execution side effects or teardown proof differ"
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $candidatePython).Hash.ToLowerInvariant() -cne [string]$env:VIA000_ENVIRONMENT_PYTHON_SHA256) {
            throw "locked environment Python changed after mutation containment"
          }
          } catch {
            if (Test-Path -LiteralPath $workspace) {
              Remove-Item -LiteralPath $workspace -Recurse -Force -ErrorAction SilentlyContinue
            }
            throw
          }

      - name: Capture exact attestation subjects after containment teardown
        id: subjects
        shell: pwsh
        env:
          VIA000_STAGE: ${{ matrix.stage }}
          VIA000_PLATFORM: ${{ matrix.platform }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($IsWindows) {
            $expectedShell = 'C:\Program Files\PowerShell\7\pwsh.exe'
            $expectedPath = 'C:\Program Files\PowerShell\7;C:\Program Files\Git\usr\bin;C:\Program Files\Git\mingw64\bin;C:\Program Files\Git\cmd;C:\Windows\System32;C:\Windows'
            $shellComparison = [StringComparison]::OrdinalIgnoreCase
          } elseif ($IsLinux) {
            $expectedShell = '/opt/microsoft/powershell/7/pwsh'
            $expectedPath = '/opt/microsoft/powershell/7:/usr/bin:/bin'
            $shellComparison = [StringComparison]::Ordinal
          } else {
            throw "trusted hosted built-in pwsh operating system differs"
          }
          $processModule = [Diagnostics.Process]::GetCurrentProcess().MainModule
          $observedShell = if ($null -eq $processModule) { '' } else { [IO.Path]::GetFullPath($processModule.FileName) }
          $psHomeShell = [IO.Path]::GetFullPath((Join-Path $PSHOME $(if ($IsWindows) { 'pwsh.exe' } else { 'pwsh' })))
          $profileFiles = @($PROFILE.AllUsersAllHosts, $PROFILE.AllUsersCurrentHost, $PROFILE.CurrentUserAllHosts, $PROFILE.CurrentUserCurrentHost) | Select-Object -Unique
          if (-not $observedShell.Equals($expectedShell, $shellComparison) -or
              -not $psHomeShell.Equals($expectedShell, $shellComparison) -or
              $PSVersionTable.PSVersion.ToString() -cnotmatch '^7\.[0-9]+\.[0-9]+$' -or
              @($profileFiles | Where-Object { Test-Path -LiteralPath $_ }).Count -ne 0 -or
              [string]$env:PATH -cne $expectedPath) {
            throw "trusted hosted built-in pwsh identity, profile, version, or PATH differs"
          }
          $evidence = Join-Path $env:RUNNER_TEMP "via000-r3-$([string]$env:VIA000_STAGE)-stage/evidence"
          $summary = Join-Path $evidence "stage-summary.json"
          $manifest = Join-Path $evidence "evidence-manifest.json"
          $githubOutputItem = Get-Item -LiteralPath $env:GITHUB_OUTPUT -Force -ErrorAction Stop
          if (-not ($githubOutputItem -is [IO.FileInfo]) -or
              ($githubOutputItem.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw "subject output control file identity differs"
          }
          $outputLengthBefore = $githubOutputItem.Length
          foreach ($item in @(
            @("summary_sha256", $summary),
            @("manifest_sha256", $manifest)
          )) {
            $path = [string]$item[1]
            $file = Get-Item -LiteralPath $path -Force -ErrorAction Stop
            if (-not ($file -is [IO.FileInfo]) -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw "attestation subject is not one regular non-reparse file"
            }
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$([string]$item[0])=$digest`n", [Text.UTF8Encoding]::new($false))
          }
          if ((Get-Item -LiteralPath $env:GITHUB_OUTPUT -Force).Length -le $outputLengthBefore) {
            throw "attestation subject outputs were not persisted"
          }

      - name: Attest exact platform subjects
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            ${{ runner.temp }}/via000-r3-${{ matrix.stage }}-stage/evidence/stage-summary.json
            ${{ runner.temp }}/via000-r3-${{ matrix.stage }}-stage/evidence/evidence-manifest.json

      - name: Retain producer attestation bundle
        shell: pwsh
        env:
          VIA000_ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VIA000_STAGE: ${{ matrix.stage }}
          VIA000_PLATFORM: ${{ matrix.platform }}
          VIA000_SUMMARY_SHA256: ${{ steps.subjects.outputs.summary_sha256 }}
          VIA000_MANIFEST_SHA256: ${{ steps.subjects.outputs.manifest_sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($IsWindows) {
            $expectedShell = 'C:\Program Files\PowerShell\7\pwsh.exe'
            $expectedPath = 'C:\Program Files\PowerShell\7;C:\Program Files\Git\usr\bin;C:\Program Files\Git\mingw64\bin;C:\Program Files\Git\cmd;C:\Windows\System32;C:\Windows'
            $shellComparison = [StringComparison]::OrdinalIgnoreCase
          } elseif ($IsLinux) {
            $expectedShell = '/opt/microsoft/powershell/7/pwsh'
            $expectedPath = '/opt/microsoft/powershell/7:/usr/bin:/bin'
            $shellComparison = [StringComparison]::Ordinal
          } else {
            throw "trusted hosted built-in pwsh operating system differs"
          }
          $processModule = [Diagnostics.Process]::GetCurrentProcess().MainModule
          $observedShell = if ($null -eq $processModule) { '' } else { [IO.Path]::GetFullPath($processModule.FileName) }
          $psHomeShell = [IO.Path]::GetFullPath((Join-Path $PSHOME $(if ($IsWindows) { 'pwsh.exe' } else { 'pwsh' })))
          $profileFiles = @($PROFILE.AllUsersAllHosts, $PROFILE.AllUsersCurrentHost, $PROFILE.CurrentUserAllHosts, $PROFILE.CurrentUserCurrentHost) | Select-Object -Unique
          if (-not $observedShell.Equals($expectedShell, $shellComparison) -or
              -not $psHomeShell.Equals($expectedShell, $shellComparison) -or
              $PSVersionTable.PSVersion.ToString() -cnotmatch '^7\.[0-9]+\.[0-9]+$' -or
              @($profileFiles | Where-Object { Test-Path -LiteralPath $_ }).Count -ne 0 -or
              [string]$env:PATH -cne $expectedPath) {
            throw "trusted hosted built-in pwsh identity, profile, version, or PATH differs"
          }
          $evidence = Join-Path $env:RUNNER_TEMP "via000-r3-$([string]$env:VIA000_STAGE)-stage/evidence"
          $summary = Join-Path $evidence "stage-summary.json"
          $manifest = Join-Path $evidence "evidence-manifest.json"
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $summary).Hash.ToLowerInvariant() -cne [string]$env:VIA000_SUMMARY_SHA256 -or
              (Get-FileHash -Algorithm SHA256 -LiteralPath $manifest).Hash.ToLowerInvariant() -cne [string]$env:VIA000_MANIFEST_SHA256) {
            throw "attestation subjects changed after trusted capture"
          }
          $destination = Join-Path $evidence "producer-attestation.sigstore.json"
          Copy-Item -LiteralPath $env:VIA000_ATTESTATION_BUNDLE `
            -Destination $destination
          $destinationItem = Get-Item -LiteralPath $destination -Force -ErrorAction Stop
          if (-not ($destinationItem -is [IO.FileInfo]) -or
              ($destinationItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
              $destinationItem.Length -le 0) {
            throw "producer attestation bundle was not retained"
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $summary).Hash.ToLowerInvariant() -cne [string]$env:VIA000_SUMMARY_SHA256 -or
              (Get-FileHash -Algorithm SHA256 -LiteralPath $manifest).Hash.ToLowerInvariant() -cne [string]$env:VIA000_MANIFEST_SHA256) {
            throw "attestation subjects changed while retaining the signed bundle"
          }

      - name: Remove rejected platform workspace
        if: failure()
        shell: pwsh
        env:
          VIA000_STAGE: ${{ matrix.stage }}
          VIA000_PLATFORM: ${{ matrix.platform }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($IsWindows) {
            $expectedShell = 'C:\Program Files\PowerShell\7\pwsh.exe'
            $expectedPath = 'C:\Program Files\PowerShell\7;C:\Program Files\Git\usr\bin;C:\Program Files\Git\mingw64\bin;C:\Program Files\Git\cmd;C:\Windows\System32;C:\Windows'
            $shellComparison = [StringComparison]::OrdinalIgnoreCase
          } elseif ($IsLinux) {
            $expectedShell = '/opt/microsoft/powershell/7/pwsh'
            $expectedPath = '/opt/microsoft/powershell/7:/usr/bin:/bin'
            $shellComparison = [StringComparison]::Ordinal
          } else {
            throw "trusted hosted built-in pwsh operating system differs"
          }
          $processModule = [Diagnostics.Process]::GetCurrentProcess().MainModule
          $observedShell = if ($null -eq $processModule) { '' } else { [IO.Path]::GetFullPath($processModule.FileName) }
          $psHomeShell = [IO.Path]::GetFullPath((Join-Path $PSHOME $(if ($IsWindows) { 'pwsh.exe' } else { 'pwsh' })))
          $profileFiles = @($PROFILE.AllUsersAllHosts, $PROFILE.AllUsersCurrentHost, $PROFILE.CurrentUserAllHosts, $PROFILE.CurrentUserCurrentHost) | Select-Object -Unique
          if (-not $observedShell.Equals($expectedShell, $shellComparison) -or
              -not $psHomeShell.Equals($expectedShell, $shellComparison) -or
              $PSVersionTable.PSVersion.ToString() -cnotmatch '^7\.[0-9]+\.[0-9]+$' -or
              @($profileFiles | Where-Object { Test-Path -LiteralPath $_ }).Count -ne 0 -or
              [string]$env:PATH -cne $expectedPath) {
            throw "trusted hosted built-in pwsh identity, profile, version, or PATH differs"
          }
          $workspace = Join-Path $env:RUNNER_TEMP "via000-r3-$([string]$env:VIA000_STAGE)-stage"
          if (Test-Path -LiteralPath $workspace) {
            Remove-Item -LiteralPath $workspace -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path -LiteralPath $workspace) { throw "rejected platform workspace cleanup did not persist" }

      - name: Retain immutable platform fragment
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: via000-r3-protocol-${{ matrix.platform }}-${{ matrix.stage }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/via000-r3-${{ matrix.stage }}-stage/evidence/
            ${{ runner.temp }}/via000-r3-${{ matrix.stage }}-stage/pdf/
          if-no-files-found: error
          retention-days: 90
