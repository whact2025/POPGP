hypothesis: A frozen blind rule recovers held-out geometry and rejects or abstains on non-geometric controls
  without evaluator leakage.
null_or_competitors:
- The result is tuned to chain/grid examples.
- Non-geometric controls receive stable low-dimensional declarations.
known_failure_to_retain: Retain the perturbed-Bell D*=1 false positive unless a label-independent frozen
  rule rejects it. Retain the R2 invalid reproduction attempt as protocol-identity evidence; R3 may not
  reinterpret or rerun R2.
threat_model:
- threshold tuning
- dimension penalty
- abstention hiding failures
- node order
- adversarial correlations
preregistration:
  parameters:
    geometric_precision_min: 0.9
    geometric_recall_min: 0.9
    distance_distortion_max: 0.2
    family_false_geometric_rate_max: 0.05
    family_abstention_rate_max: 0.25
    permutation_absolute_tolerance: 1.0e-10
    perturbation_stability_min: 0.95
  measurement_procedure: Evaluate held-out chain, square, triangular, 3D, long-range, expander, random-regular,
    shuffled, uniform, Bell, and feasible topological controls; keep truth evaluator-only and report family-balanced
    recovery, distortion, status, dimension, stress, calibration, and abstention.
  uncertainty_procedure: Use family-level bootstrap intervals and exact permutation checks; no family
    can be rescued by averaging with easier families.
  statistical_analysis: Pass only if every geometric family clears recovery/distortion bounds, every control
    stays below false geometry, abstention stays bounded, and equivariance/stability pass.
  resource_budget:
    wall_time_seconds: 14400
    memory_bytes: 17179869184
    accelerator_seconds: 0
  commands:
  - uv run pytest -q tests/scientific/test_topology_recovery.py tests/unit/test_geometry.py
  - uv run python -m examples.physics_qg.chain_1d
  - uv run python -m examples.physics_qg.grid_2d
  mutation_plan:
  - Perturb Bell controls.
  - Sweep the dimension penalty.
  - Permute labels.
  - Inject symmetric noise.
  - Construct an adversarial shuffled correlation matrix.
  protocol_artifacts:
  - receipt_id: protocol
