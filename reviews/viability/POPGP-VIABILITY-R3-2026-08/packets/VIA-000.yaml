      excluded_threat: A malicious or colluding assigned runner/GitHub control-plane principal, including
        the pinned action principals, that fabricates a complete internally consistent execution transcript
        is outside the R3 claim.
      validator_claim: >-
        The GitHub control plane and exact pinned action revisions are the declared bootstrap
        trust principal. Before authorization reads or experiment workspace creation, the workflow validates
        fixed hosted-runner labels, single exact setup-python 3.11.15 output/root, canonical non-reparse
        executable paths, exact uv 0.11.11 and TeX Live 2026 banners, and retained SHA-256 identities
        for Git, ssh-keygen, base/environment Python, uv, pdfTeX, PowerShell, and the containment protocol.
        Every candidate- or mutation-controlled command runs under an OS-enforced security boundary: a
        low-integrity restricted token atomically assigned to a kill-on-close Windows Job Object before
        its first instruction, or a systemd DynamicUser transient service with control-group kill semantics
        on Ubuntu. Mutable roots are separated from protected tool/evidence roots, complete descendant
        teardown is proven before trusted evidence creation, and attestation subject hashes are captured
        and rechecked only after quiescence. PATH/PATHEXT, TEMP/TMP/RUNNER_TEMP, loader, Git, Python, uv,
        and TeX caller surfaces are scrubbed; all execution uses explicit absolute paths and argument arrays.
        The dispatch guard and validator bind a manual content-addressed source tag to a separately SSH-signed
        authorization tag and immutable campaign/packet/manifest bytes. Before output, the assembler executes
        the manifest-verified validator closure from source-snapshot Git blobs, verifies every retained
        containment proof and all six stage attestations, derives the eighteen mutation outcomes, and rejects
        cross-run mixing. It does not claim to defeat a malicious or colluding trusted GitHub control-plane
        or pinned-action principal.
    native_or_scalable_claim_in_scope: false
    seed_policy: Use only committed public seeds or the custodian-supplied secret seed; never inspect,
      reselect, rerun, or replace output after commitment.
  measurement_procedure: >-
    Manually dispatch the pinned GitHub Actions workflow from the lightweight content-addressed
    tag refs/tags/popgp-via000-r3-protocol-<protocol-snapshot-commit> and supply the separately SSH-signed
    authorization tag refs/tags/popgp-via000-r3-authorization-<authorization-record-sha256>. The workflow
    transports every GitHub value into PowerShell only through step environment data, validates the exact
    authorization-ref grammar before any use, and accepts the GitHub control plane plus exact pinned action
    revisions as its bootstrap trust principal. Before authorization reads or experiment workspace creation
    it requires the exact ubuntu-24.04 or windows-2025 image family, exact setup-action Python 3.11.15
    output and trusted tool-cache root, canonical regular non-reparse Git/ssh-keygen/Python/PowerShell
    paths, uv 0.11.11 derived from trusted Python sysconfig, and pdfTeX from the pinned TeX Live 2026
    root. It records and rechecks executable SHA-256 identities, clears PATH/PATHEXT and caller-controlled
    child-process environment, and passes only explicit absolute executable paths through argument arrays.
    Before execution, capture the authorization ref as one full tag object ID. The dispatch guard must
    use that exact immutable object ID for type checking, record parsing, target peeling, SSH signature
    verification, and returned identity, then prove the ref still resolves to the captured object. It
    also verifies the frozen signer, canonical authorization record, exact campaign/packet/manifest blob
    hashes, authorized packet protocol_commit, source-tag suffix and resolution, github.sha, and checkout
    HEAD. On both declared platforms, the assigned reproduction-runner seat executes the supporting runner
    with the derived commit/ref and one shared GitHub run ID/attempt. Each candidate- or mutation-controlled
    command executes in a fresh OS-enforced boundary: a restricted low-integrity process tree in a kill-on-close
    Windows Job Object, or a systemd DynamicUser transient service and control group on Ubuntu. The runner
    gives that identity only mutable staging roots, keeps tool/configuration and evidence roots non-writable,
    tears down the complete descendant tree, proves zero active descendants, and only then creates trusted
    evidence and captures attestation subject hashes. The runner creates a fresh exact-candidate
    clone, a fresh locked non-editable copied Python environment, external caches and evidence directories,
    and extracts the trusted reproduction-boundary checker from the candidate Git object database with
    the explicit base Python interpreter under -I -S. Retain the tool-identity manifest, literal source
    and complete environment manifests, per-command stdout, stderr, timing, exit status, containment result
    and hashes; run
    Ruff, TeX source validation, the complete test suite, all six generators, semantic/visual/change-boundary
    validation, two pinned canonical pdfTeX passes to an external directory, and the frozen mutation-test
    matrix. The workflow signs the exact post-quiescence platform summary and evidence manifest with GitHub OIDC/Sigstore
    provenance. Before output, the assembler independently captures the authorization object and re-runs
    the same immutable-object guard, derives identity only from authorized immutable bytes, verifies the
    exact repository, signer workflow, source commit, refs, shared run identity, packet protocol commit,
    transported bytes, tool-identity and containment evidence, then extracts and executes the manifest-verified semantic
    validator and all local dependencies from the source snapshot with the real authorized packet. The
    runner must produce separate Linux and Windows raw evidence and a single pre-reveal output commitment.
  uncertainty_procedure: Candidate commit/tree, Git object and mode bindings, command exits, test/example/mutation
    counts, environment/source manifests, startup-hook isolation, tracked/untracked/ignored cleanliness,
    PDF engine/output, raw semantic identities, structure, types, shapes, pass Booleans, and receipt hashes
    are exact. Numeric comparison uses only the frozen checker tolerances; after canonicalized near-zero
    plot annotations, every cross-platform raster channel must differ by at most 4. Stored summaries cannot
    substitute for recomputation from the lowest-level retained operands.
  statistical_analysis: Pass only if the manual source ref, one captured and verified authorization tag
    object ID, signed authorization, authorized campaign/packet/manifest bytes, resolved commit, github.sha,
    checkout HEAD, runner and mutation identities, Sigstore source digest, assembler-derived commit, raw-results
    identity, and packet protocol commit are identical; both platform fragments carry one shared GitHub
    run ID/attempt; both GitHub-attested platform executions complete the protocol at the exact candidate
    and frozen protocol source; both retained tool-identity manifests prove the exact platform family,
    explicit trusted-root executable paths, versions, and SHA-256 identities used before and during execution;
    all 366 candidate tests and six generators pass; the attested mutation suite proves every frozen family
    through the exact preregistered test prefixes and case counts; every semantic and visual decision
    is recomputed and valid; all twelve corresponding Ubuntu/Windows rasters satisfy the calibrated channel
    bound; the fresh two-pass PDF parses as exactly eleven pages; source and environment boundaries remain
    valid; and every required result is signed and hash retained. A workflow-source expression, malformed
    or executable-looking dispatch value, dispatcher-PATH/PATHEXT tool shadow, substituted setup-action
    output, wrong tool root/version/banner/hash, command shim, symlink/junction/reparse tool path, wrong
    lifecycle HEAD/ref, later self-consistent source tag, moved/substituted authorization, authorization-ref
    change during parse/peel/signature verification, mutable validator dependency, ref-resolution mismatch,
    wrong-source attestation, cross-run fragment, missing command/platform, substituted state, stale decision,
    corrupt visual, repository-local residue, missing mutation, partial failed workspace, post-output
    replacement, or prose-only evidence fails closed before commitment. R3 raw results cannot self-declare
    blockage; an incomplete or unavailable execution is an invalid attempt that must not be assembled
    or committed, while malformed protocol, custody, evidence, provenance, or rule state invalidates the
    round rather than producing a scientific outcome.
