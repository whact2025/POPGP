hypothesis: The independently reviewed candidate can be rebuilt on Linux and Windows from a literal Git/object
  and complete locked-environment boundary, reproduce every retained decision from raw operands and declared
  provenance, build the manuscript, and reject every preregistered evidence, startup, source-boundary,
  visual, and correlated semantic corruption.
null_or_competitors:
- The apparent passes depend on undeclared builder state, one operating system, or mutable environment/source
  bytes.
- The semantic or visual oracle accepts a decision-changing corruption within its portability tolerance.
- Correlated graph, source, or solver-configuration changes preserve a residual while contradicting upstream
  retained provenance.
- The manuscript or committed structured artifacts cannot be reproduced from the exact candidate.
known_failure_to_retain: Retain the valid failed R1 VIA-000 outcome, Linux regeneration/startup-boundary
  failures, CA failed headline, perturbed-Bell false geometry, raw-relative-entropy source failure, entropy
  confound, and reduced-modular localization failure. R2 may not overwrite or reinterpret R1. Retain the
  R2 invalid reproduction attempt as protocol-identity evidence; R3 may not reinterpret or rerun R2.
threat_model:
- undeclared local, environment, startup, cache, index, filter, symlink, or platform state
- regeneration without semantic or calibrated visual equivalence
- stale, duplicated, weakened, mistyped, non-finite, or summary-only decision evidence
- correlated graph, source, mass, gauge, policy, and diagnostic mutations that preserve a downstream residual
- repository-local PDF output, dirty regeneration, missing raw logs, or evidence available only in prose
- post-output replacement, premature reveal, or broken custody/receipt chronology
