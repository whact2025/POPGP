hypothesis: A globally derived retention/capacity rule selects stable partitions and an area-like law
  without encoding the target.
null_or_competitors:
- The tolerance encodes the answer.
- Volume and area laws are equally supported.
- Local flow disagrees with exhaustive minima.
known_failure_to_retain: Retain that exhaustive contiguous-block search is a finite surrogate and the
  capacity scale is imposed. Retain the R2 invalid reproduction attempt as protocol-identity evidence;
  R3 may not reinterpret or rerun R2.
threat_model:
- probe-seed selection
- trivial information destruction
- target constraint
- post-selected scaling law
preregistration:
  parameters:
    overlap_flow_agreement_min: 0.95
    partition_stability_min: 0.9
    area_vs_volume_delta_aic_min: 10.0
    nongeometric_area_support_max: 0.1
    minimum_refinement_levels: 4
  measurement_procedure: Derive the retention budget independently; compare local flow with exhaustive
    minima; sweep probes, sizes, perturbations, interactions, and resolution; compare area and volume
    laws on blinded geometric and non-geometric families.
  uncertainty_procedure: Report partition degeneracy, seed variability, model-selection uncertainty, and
    refinement uncertainty with family-balanced aggregation.
  statistical_analysis: Pass only when one global rule clears the stability, overlap, model-comparison,
    and non-geometric bounds without target-derived constraints.
  resource_budget:
    wall_time_seconds: 14400
    memory_bytes: 17179869184
    accelerator_seconds: 0
  commands:
  - uv run pytest -q tests/unit/test_coarse_grain.py tests/unit/test_capacity.py
  - uv run python -m examples.physics_qg.chain_1d
  mutation_plan:
  - Force a trivial partition.
  - Choose the best seed after evaluation.
  - Encode the desired partition in admissibility.
  - Swap area and volume labels.
