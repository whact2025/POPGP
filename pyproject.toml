[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "popgp"
version = "0.1.0"
description = "Phase-Ordered Pre-Geometric Projection framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "torch>=2.10.0",
    "scipy",
    "quimb",
    "autoray",
    "cotengra",
    "pyvista",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "scientific: scientific regression or falsification tests",
    "negative_control: demonstrated input or mutation that crosses a gate boundary",
    "slow: tests that perform exact diagonalization or combinatorial search",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["popgp"]
