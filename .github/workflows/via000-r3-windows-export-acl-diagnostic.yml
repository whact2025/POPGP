name: VIA-000 R3 Windows export ACL diagnostic (non-authoritative)

on:
  push:
    branches:
      - experiment/via000-r3-windows-export-acl-*

permissions:
  contents: read

concurrency:
  group: via000-r3-windows-export-acl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-export-descriptor:
    name: Windows export descriptor diagnostic
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      PATH: 'C:\Program Files\PowerShell\7;C:\Program Files\Git\usr\bin;C:\Program Files\Git\mingw64\bin;C:\Program Files\Git\cmd;C:\Windows\System32;C:\Windows'
    steps:
      - name: Checkout diagnostic closure only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/via000-r3-windows-export-acl-diagnostic.yml
            experiments/via000-r3-windows-export-acl-1/RR17-WINDOWS-EXPORT-ATTACK.ps1
            experiments/via000-r3-windows-export-acl-1/RR17-WINDOWS-EXPORT-DIAGNOSTIC.ps1
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT.ps1
      - name: Capture hosted export descriptor after production containment teardown
        shell: pwsh
        env: &diagnostic-env
          VIA000_RR17_RUNNER_TEMP: ${{ runner.temp }}
          VIA000_RR17_SOURCE_SHA: ${{ github.sha }}
          VIA000_RR17_RUN_ID: ${{ github.run_id }}
          VIA000_RR17_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = "Stop"
          $expectedShell = 'C:\Program Files\PowerShell\7\pwsh.exe'
          $expectedPath = 'C:\Program Files\PowerShell\7;C:\Program Files\Git\usr\bin;C:\Program Files\Git\mingw64\bin;C:\Program Files\Git\cmd;C:\Windows\System32;C:\Windows'
          $processModule = [Diagnostics.Process]::GetCurrentProcess().MainModule
          $observedShell = if ($null -eq $processModule) { '' } else { [IO.Path]::GetFullPath($processModule.FileName) }
          $psHomeShell = [IO.Path]::GetFullPath((Join-Path $PSHOME 'pwsh.exe'))
          $profileFiles = @($PROFILE.AllUsersAllHosts, $PROFILE.AllUsersCurrentHost, $PROFILE.CurrentUserAllHosts, $PROFILE.CurrentUserCurrentHost) | Select-Object -Unique
          if (-not $observedShell.Equals($expectedShell, [StringComparison]::OrdinalIgnoreCase) -or
              -not $psHomeShell.Equals($expectedShell, [StringComparison]::OrdinalIgnoreCase) -or
              $PSVersionTable.PSVersion.ToString() -cnotmatch '^7\.[0-9]+\.[0-9]+$' -or
              @($profileFiles | Where-Object { Test-Path -LiteralPath $_ }).Count -ne 0 -or
              [string]$env:PATH -cne $expectedPath) {
            throw "trusted Windows built-in pwsh identity, profile, version, or PATH differs"
          }
          $root = [IO.Path]::GetFullPath([string]$env:GITHUB_WORKSPACE)
          $script = Join-Path $root 'experiments/via000-r3-windows-export-acl-1/RR17-WINDOWS-EXPORT-DIAGNOSTIC.ps1'
          & $expectedShell -NoLogo -NoProfile -NonInteractive -File $script `
            -Mode capture -RepoRoot $root -RunnerTemp ([string]$env:VIA000_RR17_RUNNER_TEMP) `
            -PowerShellPath $expectedShell -SourceSha ([string]$env:VIA000_RR17_SOURCE_SHA) `
            -RunId ([string]$env:VIA000_RR17_RUN_ID) -RunAttempt ([string]$env:VIA000_RR17_RUN_ATTEMPT)
          if ($LASTEXITCODE -ne 0) { throw "RR17 descriptor capture failed" }
          $evidence = Join-Path ([string]$env:VIA000_RR17_RUNNER_TEMP) "via000-r3-rr17-windows-export-acl-$($env:VIA000_RR17_RUN_ID)-$($env:VIA000_RR17_RUN_ATTEMPT)/trusted/descriptor-evidence.json"
          $item = Get-Item -LiteralPath $evidence -Force -ErrorAction Stop
          if (-not ($item -is [IO.FileInfo]) -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $item.Length -le 0) {
            throw "RR17 descriptor evidence side effect is absent"
          }
      - name: Requery descriptor and prove cross-step stability
        shell: pwsh
        env: *diagnostic-env
        run: |
          $ErrorActionPreference = "Stop"
          $expectedShell = 'C:\Program Files\PowerShell\7\pwsh.exe'
          $expectedPath = 'C:\Program Files\PowerShell\7;C:\Program Files\Git\usr\bin;C:\Program Files\Git\mingw64\bin;C:\Program Files\Git\cmd;C:\Windows\System32;C:\Windows'
          $processModule = [Diagnostics.Process]::GetCurrentProcess().MainModule
          $observedShell = if ($null -eq $processModule) { '' } else { [IO.Path]::GetFullPath($processModule.FileName) }
          $psHomeShell = [IO.Path]::GetFullPath((Join-Path $PSHOME 'pwsh.exe'))
          $profileFiles = @($PROFILE.AllUsersAllHosts, $PROFILE.AllUsersCurrentHost, $PROFILE.CurrentUserAllHosts, $PROFILE.CurrentUserCurrentHost) | Select-Object -Unique
          if (-not $observedShell.Equals($expectedShell, [StringComparison]::OrdinalIgnoreCase) -or
              -not $psHomeShell.Equals($expectedShell, [StringComparison]::OrdinalIgnoreCase) -or
              $PSVersionTable.PSVersion.ToString() -cnotmatch '^7\.[0-9]+\.[0-9]+$' -or
              @($profileFiles | Where-Object { Test-Path -LiteralPath $_ }).Count -ne 0 -or
              [string]$env:PATH -cne $expectedPath) {
            throw "trusted Windows built-in pwsh identity, profile, version, or PATH differs"
          }
          $root = [IO.Path]::GetFullPath([string]$env:GITHUB_WORKSPACE)
          $script = Join-Path $root 'experiments/via000-r3-windows-export-acl-1/RR17-WINDOWS-EXPORT-DIAGNOSTIC.ps1'
          & $expectedShell -NoLogo -NoProfile -NonInteractive -File $script `
            -Mode recheck -RepoRoot $root -RunnerTemp ([string]$env:VIA000_RR17_RUNNER_TEMP) `
            -PowerShellPath $expectedShell -SourceSha ([string]$env:VIA000_RR17_SOURCE_SHA) `
            -RunId ([string]$env:VIA000_RR17_RUN_ID) -RunAttempt ([string]$env:VIA000_RR17_RUN_ATTEMPT)
          if ($LASTEXITCODE -ne 0) { throw "RR17 cross-step descriptor recheck failed" }
