name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.11.11
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Validate manuscript source
        run: uv run python scripts/check_tex.py
      - name: Test
        run: uv run pytest -q
      - name: Regenerate documented examples
        run: |
          uv run python -m examples.physics_qg.chain_1d
          uv run python -m examples.physics_qg.grid_2d
          uv run python -m examples.physics_qg.gravity_well
          uv run python -m examples.physics_qg.source_law
          uv run python -m examples.physics_qg.source_law_many_body
          uv run python -m examples.physics_qg.ca_model
      - name: Check committed validation contracts and visual outputs
        run: uv run python scripts/check_validation_artifacts.py
