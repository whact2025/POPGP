name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure external environment and caches
        run: |
          {
            echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/popgp-ci-python-environment"
            echo "UV_CACHE_DIR=$RUNNER_TEMP/popgp-ci-uv-cache"
            echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/popgp-ci-python-cache"
            echo "PYTHONDONTWRITEBYTECODE=1"
            echo "RUFF_CACHE_DIR=$RUNNER_TEMP/popgp-ci-ruff-cache"
            echo "MPLCONFIGDIR=$RUNNER_TEMP/popgp-ci-matplotlib-cache"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/popgp-ci-general-cache"
          } >> "$GITHUB_ENV"
      - name: Install uv
        run: python -m pip install uv==0.11.11
      - name: Sync locked environment
        run: uv sync --frozen --no-editable
      - name: Lint
        run: uv run --frozen --no-editable ruff check .
      - name: Validate manuscript source
        run: uv run --frozen --no-editable python scripts/check_tex.py
      - name: Test
        run: uv run --frozen --no-editable python -m pytest -q -p no:cacheprovider
      - name: Regenerate documented examples
        run: |
          uv run --frozen --no-editable python -m examples.physics_qg.chain_1d
          uv run --frozen --no-editable python -m examples.physics_qg.grid_2d
          uv run --frozen --no-editable python -m examples.physics_qg.gravity_well
          uv run --frozen --no-editable python -m examples.physics_qg.source_law
          uv run --frozen --no-editable python -m examples.physics_qg.source_law_many_body
          uv run --frozen --no-editable python -m examples.physics_qg.ca_model
      - name: Check committed validation contracts and visual outputs
        run: uv run --frozen --no-editable python scripts/check_validation_artifacts.py --enforce-change-boundary
      - name: Retain regenerated artifacts for failed portability checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-validation-artifacts
          path: examples/physics_qg/*/results/
          if-no-files-found: error
