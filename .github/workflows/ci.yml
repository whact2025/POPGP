name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.11.11
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check popgp tests examples
      - name: Test
        run: uv run pytest -q
