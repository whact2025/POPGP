name: VIA-000 R3 containment proof only

on:
  push:
    branches:
      - campaign/via000-r3-protocol-*
      - review/via000-r3-protocol-*
    paths:
      - .github/workflows/via000-r3-containment-proof.yml
      - protocols/POPGP-VIABILITY-R3-2026-08/VIA-000.json
      - protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT.ps1
      - protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-RUNNER.ps1
      - protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-HOSTILE.ps1
      - protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF.schema.json
      - protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-ENVELOPE.schema.json
      - protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-AGGREGATOR.py
      - reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/**

permissions:
  contents: read

concurrency:
  group: via000-r3-containment-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu-candidate:
    name: proof / ubuntu-latest-x86_64 / candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PATH: /usr/bin:/bin
    outputs:
      ubuntu_candidate_digest: ${{ steps.digest.outputs.ubuntu_candidate_digest }}
    steps:
      - &proof-checkout
        name: Checkout frozen proof-only closure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/via000-r3-containment-proof.yml
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000.json
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT.ps1
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-RUNNER.ps1
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-HOSTILE.ps1
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF.schema.json
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-ENVELOPE.schema.json
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-AGGREGATOR.py
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-protocol.ps1
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof-runner.ps1
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof-hostile.ps1
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof.schema.json
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof-envelope.schema.json
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof-aggregator.py
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof-workflow.yml
      - name: Prove contained Ubuntu candidate and stage one envelope
        shell: /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        env: &ubuntu-candidate-env
          VIA000_PLATFORM_FAMILY: ubuntu-latest-x86_64
          VIA000_STAGE_ID: candidate
          VIA000_DIGEST_OUTPUT_NAME: ubuntu_candidate_digest
          VIA000_TRUSTED_POWERSHELL: /opt/microsoft/powershell/7/pwsh
          VIA000_REPOSITORY: ${{ github.repository }}
          VIA000_EVENT_NAME: ${{ github.event_name }}
          VIA000_SOURCE_REF: ${{ github.ref }}
          VIA000_SOURCE_SHA: ${{ github.sha }}
          VIA000_WORKFLOW_REF: ${{ github.workflow_ref }}
          VIA000_RUN_ID: ${{ github.run_id }}
          VIA000_RUN_ATTEMPT: ${{ github.run_attempt }}
          VIA000_RUNNER_TEMP: ${{ runner.temp }}
        run: &ubuntu-proof-run |
          $root = [string]$env:GITHUB_WORKSPACE
          $protocol = Join-Path $root "protocols/POPGP-VIABILITY-R3-2026-08/VIA-000.json"
          $runner = Join-Path $root "protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-RUNNER.ps1"
          $workspace = "/tmp/via000-proof-workspace"
          $relative = ".via000-r3-proof-cache/$($env:VIA000_PLATFORM_FAMILY)/$($env:VIA000_STAGE_ID)"
          $output = Join-Path $root $relative
          & ([string]$env:VIA000_TRUSTED_POWERSHELL) -NoLogo -NoProfile -NonInteractive -File $runner `
            -PlatformFamily ([string]$env:VIA000_PLATFORM_FAMILY) `
            -StageId ([string]$env:VIA000_STAGE_ID) -RepoRoot $root `
            -ProtocolPath $protocol -WorkspaceRoot $workspace `
            -RunnerTemp ([string]$env:VIA000_RUNNER_TEMP) -OutputRoot $output `
            -PowerShellPath ([string]$env:VIA000_TRUSTED_POWERSHELL) `
            -Repository ([string]$env:VIA000_REPOSITORY) `
            -EventName ([string]$env:VIA000_EVENT_NAME) -SourceRef ([string]$env:VIA000_SOURCE_REF) `
            -SourceSha ([string]$env:VIA000_SOURCE_SHA) -WorkflowRef ([string]$env:VIA000_WORKFLOW_REF) `
            -RunId ([string]$env:VIA000_RUN_ID) -RunAttempt ([string]$env:VIA000_RUN_ATTEMPT)
          if ($LASTEXITCODE -ne 0) { throw "containment proof cell failed" }
      - name: Validate staged envelope and emit digest only
        id: digest
        shell: /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        env: *ubuntu-candidate-env
        run: &digest-run |
          if ([string]$env:VIA000_PLATFORM_FAMILY -ceq 'windows-x86_64') {
            $expectedShell = 'C:\Program Files\PowerShell\7\pwsh.exe'
            $expectedPath = 'C:\Program Files\PowerShell\7;C:\tools\zstd;C:\Program Files\Git\usr\bin;C:\Program Files\Git\mingw64\bin;C:\Program Files\Git\cmd;C:\Windows\System32;C:\Windows'
            $processModule = [Diagnostics.Process]::GetCurrentProcess().MainModule
            $observedShell = if ($null -eq $processModule) { '' } else { [IO.Path]::GetFullPath($processModule.FileName) }
            $psHomeShell = [IO.Path]::GetFullPath((Join-Path $PSHOME 'pwsh.exe'))
            $profileFiles = @($PROFILE.AllUsersAllHosts, $PROFILE.AllUsersCurrentHost, $PROFILE.CurrentUserAllHosts, $PROFILE.CurrentUserCurrentHost) | Select-Object -Unique
            if (-not $observedShell.Equals($expectedShell, [StringComparison]::OrdinalIgnoreCase) -or
                -not $psHomeShell.Equals($expectedShell, [StringComparison]::OrdinalIgnoreCase) -or
                $PSVersionTable.PSVersion.ToString() -cnotmatch '^7\.[0-9]+\.[0-9]+$' -or
                @($profileFiles | Where-Object { Test-Path -LiteralPath $_ }).Count -ne 0 -or
                [string]$env:PATH -cne $expectedPath) {
              throw "trusted Windows built-in pwsh identity, profile, version, or PATH differs"
            }
          }
          $root = [IO.Path]::GetFullPath([string]$env:GITHUB_WORKSPACE)
          $relative = ".via000-r3-proof-cache/$($env:VIA000_PLATFORM_FAMILY)/$($env:VIA000_STAGE_ID)"
          if ($relative -cnotmatch '^\.via000-r3-proof-cache/(ubuntu-latest-x86_64|windows-x86_64)/(candidate|pdf|mutation)$') {
            throw "cell cache path differs"
          }
          $directory = Join-Path $root $relative
          $directoryItem = Get-Item -LiteralPath $directory -Force -ErrorAction Stop
          $files = @(Get-ChildItem -LiteralPath $directory -Force -ErrorAction Stop)
          if (-not ($directoryItem -is [IO.DirectoryInfo]) -or
              ($directoryItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
              $files.Count -ne 1 -or $files[0].Name -cne 'envelope.json' -or
              -not ($files[0] -is [IO.FileInfo]) -or
              ($files[0].Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw "cell cache root is not one ordinary envelope file"
          }
          $envelope = $files[0].FullName
          if ([string]$env:VIA000_PLATFORM_FAMILY -ceq 'windows-x86_64') {
            $streams = @(Get-Item -LiteralPath $envelope -Stream * -ErrorAction Stop)
            $fsutil = 'C:\Windows\System32\fsutil.exe'
            if ($streams.Count -ne 1 -or [string]$streams[0].Stream -cne ':$DATA' -or
                -not (Test-Path -LiteralPath $fsutil -PathType Leaf)) {
              throw "Windows envelope link/stream identity differs"
            }
            $links = @(& $fsutil hardlink list $envelope)
            if ($LASTEXITCODE -ne 0 -or $links.Count -ne 1) { throw "Windows envelope is not single-link" }
          } else {
            $links = & /usr/bin/stat --format=%h -- $envelope
            if ($LASTEXITCODE -ne 0 -or [string]$links -cne '1') { throw "Ubuntu envelope is not single-link" }
          }
          $bytes = [IO.File]::ReadAllBytes($envelope)
          if ($bytes.Length -le 0 -or $bytes.Length -gt 131072 -or $bytes[0] -eq 0xef -or
              $bytes[$bytes.Length - 1] -ne 10 -or [Array]::IndexOf($bytes, [byte]13) -ge 0) {
            throw "canonical envelope byte bounds differ"
          }
          $document = [Text.Encoding]::UTF8.GetString($bytes) | ConvertFrom-Json
          if ([string]$document.identity.platform_family -cne [string]$env:VIA000_PLATFORM_FAMILY -or
              [string]$document.identity.stage_id -cne [string]$env:VIA000_STAGE_ID -or
              [string]$document.identity.source_sha -cne [string]$env:VIA000_SOURCE_SHA -or
              [string]$document.identity.run_id -cne [string]$env:VIA000_RUN_ID -or
              [string]$document.identity.run_attempt -cne [string]$env:VIA000_RUN_ATTEMPT) {
            throw "canonical envelope identity differs before cache save"
          }
          $sha256 = [Security.Cryptography.SHA256]::Create()
          try {
            $digestBytes = $sha256.ComputeHash($bytes)
          } finally {
            $sha256.Dispose()
          }
          $digest = ([BitConverter]::ToString($digestBytes)).Replace('-', '').ToLowerInvariant()
          if ($digest -cnotmatch '^[0-9a-f]{64}$' -or
              [string]$env:VIA000_DIGEST_OUTPUT_NAME -cnotmatch '^(ubuntu|windows)_(candidate|pdf|mutation)_digest$') {
            throw "canonical envelope digest output differs"
          }
          if ([string]$env:VIA000_PLATFORM_FAMILY -ceq 'windows-x86_64') {
            $protocolPath = Join-Path $root 'protocols/POPGP-VIABILITY-R3-2026-08/VIA-000.json'
            $helperPath = Join-Path $root 'protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT.ps1'
            $protocol = Get-Content -LiteralPath $protocolPath -Raw | ConvertFrom-Json
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $helperPath).Hash.ToLowerInvariant() -cne
                [string]$protocol.parameters.containment_protocol_sha256) {
              throw "frozen export security verifier hash differs"
            }
            . $helperPath
            $rootSecurity = Assert-Via000WindowsExportSecurity -Path $directory -Kind root
            $fileSecurity = Assert-Via000WindowsExportSecurity -Path $envelope -Kind file -ExpectedSha256 $digest
            if ($rootSecurity.owner_sid -cne $fileSecurity.owner_sid -or
                $fileSecurity.inherited_file_dacl -ne $true -or
                [uint16]$rootSecurity.control_flags -ne 37892 -or
                [uint16]$fileSecurity.control_flags -ne 33796 -or
                [uint32]$rootSecurity.native_ace_count -ne 1 -or
                [uint32]$fileSecurity.native_ace_count -ne 1) {
              throw "staged Windows export boundary differs before digest output"
            }
          }
          $githubOutputItem = Get-Item -LiteralPath ([string]$env:GITHUB_OUTPUT) -Force -ErrorAction Stop
          if (-not ($githubOutputItem -is [IO.FileInfo]) -or
              ($githubOutputItem.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw "GitHub output control file identity differs"
          }
          $outputLengthBefore = $githubOutputItem.Length
          [IO.File]::AppendAllText(
            [string]$env:GITHUB_OUTPUT,
            "$($env:VIA000_DIGEST_OUTPUT_NAME)=$digest`n",
            [Text.UTF8Encoding]::new($false)
          )
          $outputLengthAfter = (Get-Item -LiteralPath ([string]$env:GITHUB_OUTPUT) -Force -ErrorAction Stop).Length
          if (($outputLengthAfter - $outputLengthBefore) -ne (([string]$env:VIA000_DIGEST_OUTPUT_NAME).Length + 66)) {
            throw "GitHub digest output side effect was absent or malformed"
          }
      - name: Assert exact cross-OS archive tools
        shell: /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        env: {VIA000_PLATFORM_FAMILY: ubuntu-latest-x86_64}
        run: &cache-tools |
          if ([string]$env:VIA000_PLATFORM_FAMILY -ceq 'windows-x86_64') {
            $expectedShell = 'C:\Program Files\PowerShell\7\pwsh.exe'
            $expectedPath = 'C:\Program Files\PowerShell\7;C:\tools\zstd;C:\Program Files\Git\usr\bin;C:\Program Files\Git\mingw64\bin;C:\Program Files\Git\cmd;C:\Windows\System32;C:\Windows'
            $processModule = [Diagnostics.Process]::GetCurrentProcess().MainModule
            $observedShell = if ($null -eq $processModule) { '' } else { [IO.Path]::GetFullPath($processModule.FileName) }
            $psHomeShell = [IO.Path]::GetFullPath((Join-Path $PSHOME 'pwsh.exe'))
            $profileFiles = @($PROFILE.AllUsersAllHosts, $PROFILE.AllUsersCurrentHost, $PROFILE.CurrentUserAllHosts, $PROFILE.CurrentUserCurrentHost) | Select-Object -Unique
            if (-not $observedShell.Equals($expectedShell, [StringComparison]::OrdinalIgnoreCase) -or
                -not $psHomeShell.Equals($expectedShell, [StringComparison]::OrdinalIgnoreCase) -or
                $PSVersionTable.PSVersion.ToString() -cnotmatch '^7\.[0-9]+\.[0-9]+$' -or
                @($profileFiles | Where-Object { Test-Path -LiteralPath $_ }).Count -ne 0 -or
                [string]$env:PATH -cne $expectedPath) {
              throw "trusted Windows built-in pwsh identity, profile, version, or PATH differs"
            }
          }
          if ([string]$env:VIA000_PLATFORM_FAMILY -ceq 'windows-x86_64') {
            $tar = 'C:\Program Files\Git\usr\bin\tar.exe'
            $zstdRoot = 'C:\tools\zstd'
            $zstd = 'C:\tools\zstd\zstd.exe'
            $expectedZstdObjects = @('C:\', 'C:\tools', $zstdRoot, $zstd)
            for ($index = 0; $index -lt $expectedZstdObjects.Count; $index++) {
              $path = $expectedZstdObjects[$index]
              $item = Get-Item -LiteralPath $path -Force -ErrorAction Stop
              $expectedType = if ($index -eq ($expectedZstdObjects.Count - 1)) {
                [IO.FileInfo]
              } else {
                [IO.DirectoryInfo]
              }
              if (-not ($item -is $expectedType) -or
                  ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
                  -not ([IO.Path]::GetFullPath($item.FullName)).Equals(
                    [IO.Path]::GetFullPath($path), [StringComparison]::OrdinalIgnoreCase
                  )) {
                throw "Windows zstd path or ancestor identity differs"
              }
            }
            $streams = @(Get-Item -LiteralPath $zstd -Stream * -ErrorAction Stop)
            $fsutil = 'C:\Windows\System32\fsutil.exe'
            $links = @(& $fsutil hardlink list $zstd | Where-Object {
              -not [string]::IsNullOrWhiteSpace([string]$_)
            })
            $linkExit = $LASTEXITCODE
            $commands = @(Get-Command zstd.exe -All -CommandType Application -ErrorAction Stop)
            if ($streams.Count -ne 1 -or [string]$streams[0].Stream -cne ':$DATA' -or
                $linkExit -ne 0 -or $links.Count -ne 1 -or
                $commands.Count -ne 1 -or
                -not ([IO.Path]::GetFullPath([string]$commands[0].Path)).Equals(
                  $zstd, [StringComparison]::OrdinalIgnoreCase
                )) {
              throw "Windows zstd stream, link, or PATH resolution differs"
            }
          } elseif ([string]$env:VIA000_PLATFORM_FAMILY -ceq 'ubuntu-latest-x86_64') {
            $tar = '/usr/bin/tar'
            $zstd = '/usr/bin/zstd'
          } else {
            throw "cross-OS archive platform identity differs"
          }
          foreach ($tool in @($tar, $zstd)) {
            $item = Get-Item -LiteralPath $tool -Force -ErrorAction Stop
            if (-not ($item -is [IO.FileInfo]) -or
                ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw "cross-OS archive tool identity differs"
            }
          }
          $tarOutput = @(& $tar --version 2>&1)
          $tarExit = $LASTEXITCODE
          $zstdOutput = @(& $zstd --version 2>&1)
          $zstdExit = $LASTEXITCODE
          $tarBanner = [string]($tarOutput | Select-Object -First 1)
          $zstdBanner = [string]($zstdOutput | Select-Object -First 1)
          if ($tarExit -ne 0 -or [string]::IsNullOrWhiteSpace($tarBanner) -or
              $tarBanner -cnotmatch '^tar \(GNU tar\) [0-9]+\.[0-9]+(?:\.[0-9]+)?') {
            throw "cross-OS GNU tar exit or banner differs"
          }
          $zstdVersions = [regex]::Matches($zstdBanner, '(?<![0-9])v?([0-9]+\.[0-9]+\.[0-9]+)(?![0-9])')
          if ($zstdExit -ne 0 -or [string]::IsNullOrWhiteSpace($zstdBanner) -or
              $zstdBanner -cnotmatch 'Zstandard' -or
              $zstdVersions.Count -ne 1) {
            throw "cross-OS Zstandard exit or banner differs"
          }
          if ([string]$env:VIA000_PLATFORM_FAMILY -ceq 'windows-x86_64') {
            if ([string]$zstdVersions[0].Groups[1].Value -cne '1.5.7') {
              throw "Windows zstd version differs from frozen 1.5.7"
            }
            $zstdSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $zstd).Hash.ToLowerInvariant()
            $githubOutput = Get-Item -LiteralPath ([string]$env:GITHUB_OUTPUT) -Force -ErrorAction Stop
            if ($zstdSha256 -cnotmatch '^[0-9a-f]{64}$' -or
                -not ($githubOutput -is [IO.FileInfo]) -or
                ($githubOutput.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw "Windows zstd digest or GitHub output identity differs"
            }
            [IO.File]::AppendAllText(
              [string]$env:GITHUB_OUTPUT,
              "windows_zstd_sha256=$zstdSha256`n",
              [Text.UTF8Encoding]::new($false)
            )
            Write-Output "Windows zstd 1.5.7 identity captured from C:\tools\zstd\zstd.exe"
          }
      - name: Reject pre-existing exact cache key
        id: preflight
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .via000-r3-proof-cache/ubuntu-latest-x86_64/candidate
          key: via000-r3-envelope-v1-${{ github.repository_id }}-${{ github.workflow_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-latest-x86_64-candidate-${{ steps.digest.outputs.ubuntu_candidate_digest }}
          enableCrossOsArchive: true
          lookup-only: true
          fail-on-cache-miss: false
      - name: Require fresh exact cache key
        shell: /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        env:
          VIA000_PLATFORM_FAMILY: ubuntu-latest-x86_64
          VIA000_STAGE_ID: candidate
          VIA000_EXPECTED_DIGEST: ${{ steps.digest.outputs.ubuntu_candidate_digest }}
          VIA000_CACHE_HIT: ${{ steps.preflight.outputs.cache-hit }}
          VIA000_CACHE_PRIMARY: ${{ steps.preflight.outputs.cache-primary-key }}
          VIA000_CACHE_MATCHED: ${{ steps.preflight.outputs.cache-matched-key }}
          VIA000_CACHE_KEY: via000-r3-envelope-v1-${{ github.repository_id }}-${{ github.workflow_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-latest-x86_64-candidate-${{ steps.digest.outputs.ubuntu_candidate_digest }}
        run: &preflight-check |
          if ([string]$env:VIA000_PLATFORM_FAMILY -ceq 'windows-x86_64') {
            $expectedShell = 'C:\Program Files\PowerShell\7\pwsh.exe'
            $expectedPath = 'C:\Program Files\PowerShell\7;C:\tools\zstd;C:\Program Files\Git\usr\bin;C:\Program Files\Git\mingw64\bin;C:\Program Files\Git\cmd;C:\Windows\System32;C:\Windows'
            $processModule = [Diagnostics.Process]::GetCurrentProcess().MainModule
            $observedShell = if ($null -eq $processModule) { '' } else { [IO.Path]::GetFullPath($processModule.FileName) }
            $psHomeShell = [IO.Path]::GetFullPath((Join-Path $PSHOME 'pwsh.exe'))
            $profileFiles = @($PROFILE.AllUsersAllHosts, $PROFILE.AllUsersCurrentHost, $PROFILE.CurrentUserAllHosts, $PROFILE.CurrentUserCurrentHost) | Select-Object -Unique
            if (-not $observedShell.Equals($expectedShell, [StringComparison]::OrdinalIgnoreCase) -or
                -not $psHomeShell.Equals($expectedShell, [StringComparison]::OrdinalIgnoreCase) -or
                $PSVersionTable.PSVersion.ToString() -cnotmatch '^7\.[0-9]+\.[0-9]+$' -or
                @($profileFiles | Where-Object { Test-Path -LiteralPath $_ }).Count -ne 0 -or
                [string]$env:PATH -cne $expectedPath) {
              throw "trusted Windows built-in pwsh identity, profile, version, or PATH differs"
            }
          }
          if ([string]$env:VIA000_CACHE_KEY -cnotmatch '^via000-r3-envelope-v1-[1-9][0-9]*-[0-9a-f]{40}-[0-9a-f]{40}-[1-9][0-9]*-[1-9][0-9]*-(ubuntu-latest-x86_64|windows-x86_64)-(candidate|pdf|mutation)-[0-9a-f]{64}$' -or
              ([string]$env:VIA000_CACHE_KEY).Length -ge 512 -or
              [string]$env:VIA000_CACHE_PRIMARY -cne [string]$env:VIA000_CACHE_KEY -or
              [string]$env:VIA000_CACHE_HIT -ne '' -or [string]$env:VIA000_CACHE_MATCHED -ne '') {
            throw "exact digest-bound cache key already exists or preflight differs"
          }
          if ([string]$env:VIA000_PLATFORM_FAMILY -ceq 'windows-x86_64') {
            $zstdRoot = 'C:\tools\zstd'
            $zstd = 'C:\tools\zstd\zstd.exe'
            $expectedZstdSha256 = [string]$env:VIA000_ZSTD_SHA256
            $expectedZstdObjects = @('C:\', 'C:\tools', $zstdRoot, $zstd)
            for ($index = 0; $index -lt $expectedZstdObjects.Count; $index++) {
              $path = $expectedZstdObjects[$index]
              $item = Get-Item -LiteralPath $path -Force -ErrorAction Stop
              $expectedType = if ($index -eq ($expectedZstdObjects.Count - 1)) {
                [IO.FileInfo]
              } else {
                [IO.DirectoryInfo]
              }
              if (-not ($item -is $expectedType) -or
                  ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
                  -not ([IO.Path]::GetFullPath($item.FullName)).Equals(
                    [IO.Path]::GetFullPath($path), [StringComparison]::OrdinalIgnoreCase
                  )) {
                throw "Windows zstd path or ancestor changed before or after cache save"
              }
            }
            $streams = @(Get-Item -LiteralPath $zstd -Stream * -ErrorAction Stop)
            $fsutil = 'C:\Windows\System32\fsutil.exe'
            $links = @(& $fsutil hardlink list $zstd | Where-Object {
              -not [string]::IsNullOrWhiteSpace([string]$_)
            })
            $linkExit = $LASTEXITCODE
            $commands = @(Get-Command zstd.exe -All -CommandType Application -ErrorAction Stop)
            $zstdOutput = @(& $zstd --version 2>&1)
            $zstdExit = $LASTEXITCODE
            $zstdBanner = [string]($zstdOutput | Select-Object -First 1)
            $zstdVersions = [regex]::Matches($zstdBanner, '(?<![0-9])v?([0-9]+\.[0-9]+\.[0-9]+)(?![0-9])')
            $observedZstdSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $zstd).Hash.ToLowerInvariant()
            if ($streams.Count -ne 1 -or [string]$streams[0].Stream -cne ':$DATA' -or
                $linkExit -ne 0 -or $links.Count -ne 1 -or
                $commands.Count -ne 1 -or
                -not ([IO.Path]::GetFullPath([string]$commands[0].Path)).Equals(
                  $zstd, [StringComparison]::OrdinalIgnoreCase
                ) -or $zstdExit -ne 0 -or $zstdBanner -cnotmatch 'Zstandard' -or
                $zstdVersions.Count -ne 1 -or
                [string]$zstdVersions[0].Groups[1].Value -cne '1.5.7' -or
                $expectedZstdSha256 -cnotmatch '^[0-9a-f]{64}$' -or
