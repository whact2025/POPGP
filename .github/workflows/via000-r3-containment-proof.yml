        env: {VIA000_PLATFORM_FAMILY: windows-x86_64, VIA000_STAGE_ID: mutation, VIA000_EXPECTED_DIGEST: '${{ steps.digest.outputs.windows_mutation_digest }}', VIA000_ZSTD_SHA256: '${{ steps.archive_tools.outputs.windows_zstd_sha256 }}', VIA000_CACHE_HIT: '${{ steps.preflight.outputs.cache-hit }}', VIA000_CACHE_PRIMARY: '${{ steps.preflight.outputs.cache-primary-key }}', VIA000_CACHE_MATCHED: '${{ steps.preflight.outputs.cache-matched-key }}', VIA000_CACHE_KEY: 'via000-r3-envelope-v1-${{ github.repository_id }}-${{ github.workflow_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-windows-x86_64-mutation-${{ steps.digest.outputs.windows_mutation_digest }}'}
        run: *preflight-check
      - name: Save one exact digest-bound envelope cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with: {path: .via000-r3-proof-cache/windows-x86_64/mutation, key: 'via000-r3-envelope-v1-${{ github.repository_id }}-${{ github.workflow_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-windows-x86_64-mutation-${{ steps.digest.outputs.windows_mutation_digest }}', enableCrossOsArchive: true}
      - name: Recheck archive tool and staged envelope after cache save
        shell: pwsh
        env: {VIA000_PLATFORM_FAMILY: windows-x86_64, VIA000_STAGE_ID: mutation, VIA000_EXPECTED_DIGEST: '${{ steps.digest.outputs.windows_mutation_digest }}', VIA000_ZSTD_SHA256: '${{ steps.archive_tools.outputs.windows_zstd_sha256 }}', VIA000_CACHE_HIT: '${{ steps.preflight.outputs.cache-hit }}', VIA000_CACHE_PRIMARY: '${{ steps.preflight.outputs.cache-primary-key }}', VIA000_CACHE_MATCHED: '${{ steps.preflight.outputs.cache-matched-key }}', VIA000_CACHE_KEY: 'via000-r3-envelope-v1-${{ github.repository_id }}-${{ github.workflow_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-windows-x86_64-mutation-${{ steps.digest.outputs.windows_mutation_digest }}'}
        run: *preflight-check

  aggregate:
    name: restore and consolidate six digest-bound caches on Ubuntu
    if: always()
    needs: [ubuntu-candidate, ubuntu-pdf, ubuntu-mutation, windows-candidate, windows-pdf, windows-mutation]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env: {PATH: /usr/bin:/bin}
    outputs:
      artifact_id: ${{ steps.normalize-artifact.outputs.artifact_id }}
      artifact_digest: ${{ steps.normalize-artifact.outputs.artifact_digest }}
      artifact_url: ${{ steps.normalize-artifact.outputs.artifact_url }}
    steps:
      - name: Require six green jobs and exact distinct digests
        shell: /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        env:
          VIA000_JOB_RESULTS: ${{ join(needs.*.result, ',') }}
          VIA000_DIGEST_UBUNTU_CANDIDATE: ${{ needs.ubuntu-candidate.outputs.ubuntu_candidate_digest }}
          VIA000_DIGEST_UBUNTU_PDF: ${{ needs.ubuntu-pdf.outputs.ubuntu_pdf_digest }}
          VIA000_DIGEST_UBUNTU_MUTATION: ${{ needs.ubuntu-mutation.outputs.ubuntu_mutation_digest }}
          VIA000_DIGEST_WINDOWS_CANDIDATE: ${{ needs.windows-candidate.outputs.windows_candidate_digest }}
          VIA000_DIGEST_WINDOWS_PDF: ${{ needs.windows-pdf.outputs.windows_pdf_digest }}
          VIA000_DIGEST_WINDOWS_MUTATION: ${{ needs.windows-mutation.outputs.windows_mutation_digest }}
        run: |
          $results = ([string]$env:VIA000_JOB_RESULTS).Split(',')
          $digests = @(
            [string]$env:VIA000_DIGEST_UBUNTU_CANDIDATE, [string]$env:VIA000_DIGEST_UBUNTU_PDF,
            [string]$env:VIA000_DIGEST_UBUNTU_MUTATION, [string]$env:VIA000_DIGEST_WINDOWS_CANDIDATE,
            [string]$env:VIA000_DIGEST_WINDOWS_PDF, [string]$env:VIA000_DIGEST_WINDOWS_MUTATION
          )
          if ($results.Count -ne 6 -or @($results | Where-Object { $_ -cne 'success' }).Count -ne 0 -or
              @($digests | Where-Object { $_ -cnotmatch '^[0-9a-f]{64}$' }).Count -ne 0 -or
              @($digests | Sort-Object -Unique).Count -ne 6) {
            throw "six explicit proof jobs or digest outputs differ"
          }
      - *proof-checkout
      - name: Assert exact Ubuntu cross-OS archive tools
        shell: /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        env: {VIA000_PLATFORM_FAMILY: ubuntu-latest-x86_64}
        run: *cache-tools
      - &aggregate-python
        name: Install exact aggregate Python
        id: aggregate-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11.15', cache: ''}
      - name: Restore Ubuntu candidate cache
        id: restore-uc
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with: {path: .via000-r3-proof-cache/ubuntu-latest-x86_64/candidate, key: 'via000-r3-envelope-v1-${{ github.repository_id }}-${{ github.workflow_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-latest-x86_64-candidate-${{ needs.ubuntu-candidate.outputs.ubuntu_candidate_digest }}', enableCrossOsArchive: true, fail-on-cache-miss: true}
      - name: Restore Ubuntu pdf cache
        id: restore-up
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with: {path: .via000-r3-proof-cache/ubuntu-latest-x86_64/pdf, key: 'via000-r3-envelope-v1-${{ github.repository_id }}-${{ github.workflow_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-latest-x86_64-pdf-${{ needs.ubuntu-pdf.outputs.ubuntu_pdf_digest }}', enableCrossOsArchive: true, fail-on-cache-miss: true}
      - name: Restore Ubuntu mutation cache
        id: restore-um
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with: {path: .via000-r3-proof-cache/ubuntu-latest-x86_64/mutation, key: 'via000-r3-envelope-v1-${{ github.repository_id }}-${{ github.workflow_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-latest-x86_64-mutation-${{ needs.ubuntu-mutation.outputs.ubuntu_mutation_digest }}', enableCrossOsArchive: true, fail-on-cache-miss: true}
      - name: Restore Windows candidate cache
        id: restore-wc
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with: {path: .via000-r3-proof-cache/windows-x86_64/candidate, key: 'via000-r3-envelope-v1-${{ github.repository_id }}-${{ github.workflow_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-windows-x86_64-candidate-${{ needs.windows-candidate.outputs.windows_candidate_digest }}', enableCrossOsArchive: true, fail-on-cache-miss: true}
      - name: Restore Windows pdf cache
        id: restore-wp
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with: {path: .via000-r3-proof-cache/windows-x86_64/pdf, key: 'via000-r3-envelope-v1-${{ github.repository_id }}-${{ github.workflow_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-windows-x86_64-pdf-${{ needs.windows-pdf.outputs.windows_pdf_digest }}', enableCrossOsArchive: true, fail-on-cache-miss: true}
      - name: Restore Windows mutation cache
        id: restore-wm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with: {path: .via000-r3-proof-cache/windows-x86_64/mutation, key: 'via000-r3-envelope-v1-${{ github.repository_id }}-${{ github.workflow_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-windows-x86_64-mutation-${{ needs.windows-mutation.outputs.windows_mutation_digest }}', enableCrossOsArchive: true, fail-on-cache-miss: true}
      - name: Require six exact cache hits and matched keys
        shell: /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        env:
          VIA000_RESTORE_UC: '${{ steps.restore-uc.outputs.cache-hit }}|${{ steps.restore-uc.outputs.cache-primary-key }}|${{ steps.restore-uc.outputs.cache-matched-key }}|via000-r3-envelope-v1-${{ github.repository_id }}-${{ github.workflow_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-latest-x86_64-candidate-${{ needs.ubuntu-candidate.outputs.ubuntu_candidate_digest }}'
          VIA000_RESTORE_UP: '${{ steps.restore-up.outputs.cache-hit }}|${{ steps.restore-up.outputs.cache-primary-key }}|${{ steps.restore-up.outputs.cache-matched-key }}|via000-r3-envelope-v1-${{ github.repository_id }}-${{ github.workflow_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-latest-x86_64-pdf-${{ needs.ubuntu-pdf.outputs.ubuntu_pdf_digest }}'
          VIA000_RESTORE_UM: '${{ steps.restore-um.outputs.cache-hit }}|${{ steps.restore-um.outputs.cache-primary-key }}|${{ steps.restore-um.outputs.cache-matched-key }}|via000-r3-envelope-v1-${{ github.repository_id }}-${{ github.workflow_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-latest-x86_64-mutation-${{ needs.ubuntu-mutation.outputs.ubuntu_mutation_digest }}'
          VIA000_RESTORE_WC: '${{ steps.restore-wc.outputs.cache-hit }}|${{ steps.restore-wc.outputs.cache-primary-key }}|${{ steps.restore-wc.outputs.cache-matched-key }}|via000-r3-envelope-v1-${{ github.repository_id }}-${{ github.workflow_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-windows-x86_64-candidate-${{ needs.windows-candidate.outputs.windows_candidate_digest }}'
          VIA000_RESTORE_WP: '${{ steps.restore-wp.outputs.cache-hit }}|${{ steps.restore-wp.outputs.cache-primary-key }}|${{ steps.restore-wp.outputs.cache-matched-key }}|via000-r3-envelope-v1-${{ github.repository_id }}-${{ github.workflow_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-windows-x86_64-pdf-${{ needs.windows-pdf.outputs.windows_pdf_digest }}'
          VIA000_RESTORE_WM: '${{ steps.restore-wm.outputs.cache-hit }}|${{ steps.restore-wm.outputs.cache-primary-key }}|${{ steps.restore-wm.outputs.cache-matched-key }}|via000-r3-envelope-v1-${{ github.repository_id }}-${{ github.workflow_sha }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-windows-x86_64-mutation-${{ needs.windows-mutation.outputs.windows_mutation_digest }}'
        run: |
          foreach ($name in @('VIA000_RESTORE_UC','VIA000_RESTORE_UP','VIA000_RESTORE_UM','VIA000_RESTORE_WC','VIA000_RESTORE_WP','VIA000_RESTORE_WM')) {
            $parts = ([string][Environment]::GetEnvironmentVariable($name)).Split('|')
            if ($parts.Count -ne 4 -or $parts[0] -cne 'true' -or $parts[1] -cne $parts[3] -or
                $parts[2] -cne $parts[3] -or $parts[3].Length -ge 512) {
              throw "cache hit, primary key, or matched key differs: $name"
            }
          }
      - name: Validate six cache envelopes in memory and create seven retained files
        shell: /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        env:
          VIA000_DIGEST_UBUNTU_CANDIDATE: ${{ needs.ubuntu-candidate.outputs.ubuntu_candidate_digest }}
          VIA000_DIGEST_UBUNTU_PDF: ${{ needs.ubuntu-pdf.outputs.ubuntu_pdf_digest }}
          VIA000_DIGEST_UBUNTU_MUTATION: ${{ needs.ubuntu-mutation.outputs.ubuntu_mutation_digest }}
          VIA000_DIGEST_WINDOWS_CANDIDATE: ${{ needs.windows-candidate.outputs.windows_candidate_digest }}
          VIA000_DIGEST_WINDOWS_PDF: ${{ needs.windows-pdf.outputs.windows_pdf_digest }}
          VIA000_DIGEST_WINDOWS_MUTATION: ${{ needs.windows-mutation.outputs.windows_mutation_digest }}
          VIA000_BASE_PYTHON_OUTPUT: ${{ steps.aggregate-python.outputs.python-path }}
          VIA000_SOURCE_REF: ${{ github.ref }}
          VIA000_SOURCE_SHA: ${{ github.sha }}
          VIA000_WORKFLOW_REF: ${{ github.workflow_ref }}
          VIA000_RUN_ID: ${{ github.run_id }}
          VIA000_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $expected = "/opt/hostedtoolcache/Python/3.11.15/x64/bin/python"
          $python = "/opt/hostedtoolcache/Python/3.11.15/x64/bin/python3.11"
          if ([string]$env:VIA000_BASE_PYTHON_OUTPUT -cne $expected) { throw "aggregate Python path differs" }
          $version = & $python -I -S -c "import platform; print(platform.python_version())"
          if ($LASTEXITCODE -ne 0 -or $version -cne "3.11.15") { throw "aggregate Python differs" }
          $aggregator = Join-Path ([string]$env:GITHUB_WORKSPACE) "protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-AGGREGATOR.py"
          $output = Join-Path ([string]$env:RUNNER_TEMP) "via000-r3-retained-proof"
          & $python -I -S $aggregator --collect-cache-envelopes --output-root $output `
            --source-sha ([string]$env:VIA000_SOURCE_SHA) --source-ref ([string]$env:VIA000_SOURCE_REF) `
            --workflow-ref ([string]$env:VIA000_WORKFLOW_REF) --run-id ([string]$env:VIA000_RUN_ID) `
            --run-attempt ([string]$env:VIA000_RUN_ATTEMPT)
          if ($LASTEXITCODE -ne 0) { throw "six-cache proof consolidation failed" }
      - name: Upload one consolidated non-scientific proof
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: via000-r3-containment-proof-retained
          path: ${{ runner.temp }}/via000-r3-retained-proof
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          retention-days: 7
      - name: Normalize exact retained artifact identity
        id: normalize-artifact
        shell: /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        env:
          VIA000_RAW_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          VIA000_RAW_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          VIA000_RAW_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          VIA000_REPOSITORY: ${{ github.repository }}
          VIA000_RUN_ID: ${{ github.run_id }}
        run: |
          $expectedShell = '/opt/microsoft/powershell/7/pwsh'
          $expectedPsHome = '/opt/microsoft/powershell/7'
          $expectedInitialPath = '/opt/microsoft/powershell/7:/usr/bin:/bin'
          $expectedSanitizedPath = '/usr/bin:/bin'
          $processModule = [Diagnostics.Process]::GetCurrentProcess().MainModule
          $observedShell = if ($null -eq $processModule) { '' } else { [IO.Path]::GetFullPath($processModule.FileName) }
          $cmdlineBytes = [IO.File]::ReadAllBytes('/proc/self/cmdline')
          $argv = @([Text.Encoding]::UTF8.GetString($cmdlineBytes).Split([char]0) | Where-Object { $_.Length -gt 0 })
          $runnerTemp = [IO.Path]::GetFullPath([string]$env:RUNNER_TEMP)
          if ($runnerTemp.EndsWith('/')) { $runnerTemp = $runnerTemp.Substring(0, $runnerTemp.Length - 1) }
          $runnerScript = if ($argv.Count -eq 6) { [IO.Path]::GetFullPath([string]$argv[5]) } else { '' }
          if ($observedShell -cne $expectedShell -or [string]$PSHOME -cne $expectedPsHome -or
              $PSVersionTable.PSVersion.ToString() -cne '7.6.5' -or
              [string]$env:PATH -cne $expectedInitialPath -or $argv.Count -ne 6 -or
              [string]$argv[0] -cne $expectedShell -or [string]$argv[1] -cne '-NoLogo' -or
              [string]$argv[2] -cne '-NoProfile' -or [string]$argv[3] -cne '-NonInteractive' -or
              [string]$argv[4] -cne '-File' -or
              [IO.Path]::GetDirectoryName($runnerScript) -cne $runnerTemp -or
              [IO.Path]::GetFileName($runnerScript) -cnotmatch '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.ps1$') {
            throw 'trusted Ubuntu literal pwsh identity, argv, version, or initial PATH differs'
          }
          $env:PATH = $expectedSanitizedPath
          if ([string]$env:PATH -cne $expectedSanitizedPath) {
            throw 'sanitized PATH assignment differs before artifact identity read'
          }
          $artifactId = [string]$env:VIA000_RAW_ARTIFACT_ID
          $bareDigest = [string]$env:VIA000_RAW_ARTIFACT_DIGEST
          $artifactUrl = [string]$env:VIA000_RAW_ARTIFACT_URL
          $repository = [string]$env:VIA000_REPOSITORY
          $runId = [string]$env:VIA000_RUN_ID
          if ($repository -cne 'whact2025/POPGP' -or $runId -cnotmatch '^[1-9][0-9]*$' -or
              $artifactId -cnotmatch '^[1-9][0-9]*$' -or $bareDigest -cnotmatch '^[0-9a-f]{64}$') {
            throw 'raw retained artifact identity or digest differs'
          }
          $expectedUrl = "https://github.com/$repository/actions/runs/$runId/artifacts/$artifactId"
          if ($artifactUrl -cne $expectedUrl) { throw 'raw retained artifact URL differs' }
          $canonicalDigest = "sha256:$bareDigest"
          if ($canonicalDigest -cnotmatch '^sha256:[0-9a-f]{64}$') {
            throw 'canonical retained artifact digest differs'
          }
          $githubOutput = [string]$env:GITHUB_OUTPUT
          $outputItem = Get-Item -LiteralPath $githubOutput -Force -ErrorAction Stop
          if (-not ($outputItem -is [IO.FileInfo]) -or
              ($outputItem.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw 'GitHub artifact output control file identity differs'
          }
          if ([string]$env:PATH -cne $expectedSanitizedPath) {
            throw 'sanitized PATH differs before output-control stat'
          }
          $links = & /usr/bin/stat --format=%h -- $githubOutput
          if ($LASTEXITCODE -ne 0 -or [string]$links -cne '1') {
            throw 'GitHub artifact output control file is not single-link'
          }
          $before = $outputItem.Length
          $lines = "artifact_id=$artifactId`nartifact_digest=$canonicalDigest`nartifact_url=$artifactUrl`n"
          if ([string]$env:PATH -cne $expectedSanitizedPath) {
            throw 'sanitized PATH differs before output append'
          }
          [IO.File]::AppendAllText($githubOutput, $lines, [Text.UTF8Encoding]::new($false))
          $after = (Get-Item -LiteralPath $githubOutput -Force -ErrorAction Stop).Length
          if ([string]$env:PATH -cne $expectedSanitizedPath -or
              ($after - $before) -ne [Text.Encoding]::UTF8.GetByteCount($lines)) {
            throw 'normalized artifact output side effect was absent or malformed'
          }

  verify-retained:
    name: redownload and verify retained seven-file proof
    needs: aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env: {PATH: /usr/bin:/bin}
    steps:
      - name: Checkout frozen retained verifier only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-AGGREGATOR.py
            reviews/viability/POPGP-VIABILITY-R3-2026-08/receipts/VIA-000/containment-proof-aggregator.py
      - *aggregate-python
      - name: Download the exact consolidated proof artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: via000-r3-containment-proof-retained
          path: ${{ runner.temp }}/via000-r3-retained-proof-download
      - name: Revalidate retained bytes and recorded artifact identity
        shell: /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        env:
          VIA000_BASE_PYTHON_OUTPUT: ${{ steps.aggregate-python.outputs.python-path }}
          VIA000_ARTIFACT_ID: ${{ needs.aggregate.outputs.artifact_id }}
          VIA000_ARTIFACT_DIGEST: ${{ needs.aggregate.outputs.artifact_digest }}
          VIA000_ARTIFACT_URL: ${{ needs.aggregate.outputs.artifact_url }}
          VIA000_REPOSITORY: ${{ github.repository }}
          VIA000_SOURCE_REF: ${{ github.ref }}
          VIA000_SOURCE_SHA: ${{ github.sha }}
          VIA000_WORKFLOW_REF: ${{ github.workflow_ref }}
          VIA000_RUN_ID: ${{ github.run_id }}
          VIA000_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if ([string]$env:VIA000_ARTIFACT_ID -cnotmatch '^[1-9][0-9]*$' -or
              [string]$env:VIA000_ARTIFACT_DIGEST -cnotmatch '^sha256:[0-9a-f]{64}$' -or
              [string]$env:VIA000_REPOSITORY -cne 'whact2025/POPGP' -or
              [string]$env:VIA000_RUN_ID -cnotmatch '^[1-9][0-9]*$') {
            throw "retained artifact identity or digest is malformed"
          }
          $expectedArtifactUrl = "https://github.com/$($env:VIA000_REPOSITORY)/actions/runs/$($env:VIA000_RUN_ID)/artifacts/$($env:VIA000_ARTIFACT_ID)"
          if ([string]$env:VIA000_ARTIFACT_URL -cne $expectedArtifactUrl) {
            throw "retained artifact URL is not bound to the current repository, run, and artifact ID"
          }
          $python = "/opt/hostedtoolcache/Python/3.11.15/x64/bin/python3.11"
          if ([string]$env:VIA000_BASE_PYTHON_OUTPUT -cne "/opt/hostedtoolcache/Python/3.11.15/x64/bin/python") {
            throw "verifier Python path differs"
          }
          $aggregator = Join-Path ([string]$env:GITHUB_WORKSPACE) "protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-AGGREGATOR.py"
          $download = Join-Path ([string]$env:RUNNER_TEMP) "via000-r3-retained-proof-download"
          & $python -I -S $aggregator --verify-retained $download `
            --source-sha ([string]$env:VIA000_SOURCE_SHA) --source-ref ([string]$env:VIA000_SOURCE_REF) `
            --workflow-ref ([string]$env:VIA000_WORKFLOW_REF) --run-id ([string]$env:VIA000_RUN_ID) `
            --run-attempt ([string]$env:VIA000_RUN_ATTEMPT)
          if ($LASTEXITCODE -ne 0) { throw "retained proof revalidation failed" }
