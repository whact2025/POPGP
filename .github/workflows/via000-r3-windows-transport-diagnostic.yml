name: VIA-000 R3 RR13 Windows native child factor diagnostic

on:
  push:
    branches:
      - experiment/via000-r3-windows-transport-*
    paths:
      - .github/workflows/via000-r3-windows-transport-diagnostic.yml
      - protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-RR13-NATIVE-DIAGNOSTIC.ps1
      - protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-RR13-CHILD-FACTOR-RUNNER.ps1

permissions:
  contents: read

concurrency:
  group: via000-r3-rr13-native-child-diagnostic-${{ github.ref }}
  cancel-in-progress: false

# Disposable, synthetic, and non-authoritative. It has no secrets, scientific checkout,
# campaign execution, lifecycle access, output commitment, custody path, or retained artifact.
jobs:
  exact-proof-baseline:
    name: RR13 A / exact proof baseline
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout exact public diagnostic closure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/via000-r3-windows-transport-diagnostic.yml
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT.ps1
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-PROOF-RUNNER.ps1
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-CONTAINMENT-HOSTILE.ps1
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-RR13-NATIVE-DIAGNOSTIC.ps1
            protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-RR13-CHILD-FACTOR-RUNNER.ps1
      - name: Run exact proof baseline through reviewed primitive
        id: probe
        shell: pwsh
        env:
          PATH: 'C:\Program Files\PowerShell\7;C:\Windows\System32;C:\Windows'
          VIA000_FACTOR: exact-proof-baseline
          VIA000_CONTROL_ROOT: ${{ runner.temp }}\via000-rr13-exact-proof-baseline
          VIA000_SOURCE_SHA: ${{ github.sha }}
          VIA000_WORKFLOW_SHA: ${{ github.workflow_sha }}
          VIA000_RUN_ID: ${{ github.run_id }}
          VIA000_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $runner = Join-Path $env:GITHUB_WORKSPACE 'protocols/POPGP-VIABILITY-R3-2026-08/VIA-000-RR13-CHILD-FACTOR-RUNNER.ps1'
          & $runner -Factor $env:VIA000_FACTOR -RepoRoot $env:GITHUB_WORKSPACE `
            -ControlRoot $env:VIA000_CONTROL_ROOT -GithubOutput $env:GITHUB_OUTPUT `
            -SourceSha $env:VIA000_SOURCE_SHA -WorkflowSha $env:VIA000_WORKFLOW_SHA `
            -RunId $env:VIA000_RUN_ID -RunAttempt $env:VIA000_RUN_ATTEMPT
      - name: Recheck exact proof baseline diagnostic facts
        shell: pwsh
        env:
          PATH: 'C:\Program Files\PowerShell\7;C:\Windows\System32;C:\Windows'
          VIA000_CONTROL_ROOT: ${{ runner.temp }}\via000-rr13-exact-proof-baseline
          VIA000_SUMMARY_SHA256: ${{ steps.probe.outputs.summary_sha256 }}
          VIA000_EXIT_SIGNED: ${{ steps.probe.outputs.exit_signed }}
          VIA000_EXIT_UNSIGNED: ${{ steps.probe.outputs.exit_unsigned }}
          VIA000_EXIT_HEX: ${{ steps.probe.outputs.exit_hex }}
          VIA000_SENTINEL_PRESENT: ${{ steps.probe.outputs.sentinel_present }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedShell = 'C:\Program Files\PowerShell\7\pwsh.exe'
          $observed = [IO.Path]::GetFullPath([Diagnostics.Process]::GetCurrentProcess().MainModule.FileName)
          if (-not $observed.Equals($expectedShell,[StringComparison]::OrdinalIgnoreCase) -or
              [string]$env:PATH -cne 'C:\Program Files\PowerShell\7;C:\Windows\System32;C:\Windows') { throw 'trusted consumer boundary differs' }
          $summaryPath = Join-Path $env:VIA000_CONTROL_ROOT 'diagnostic-summary.json'
          $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json -AsHashtable
          if ((Get-FileHash -LiteralPath $summaryPath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:VIA000_SUMMARY_SHA256 -or
              $summary.factor -cne 'exact-proof-baseline' -or $summary.native_phase -cne 'post-teardown-quiescent' -or
              $summary.exit_signed -ne -1073741502 -or $summary.exit_unsigned -ne 3221225794 -or
              $summary.exit_hex -cne '0xC0000142' -or $summary.sentinel_present -ne $false -or
              $summary.active_processes_after_teardown -ne 0 -or $summary.protected_root_unchanged -ne $true -or
              $env:VIA000_EXIT_SIGNED -cne '-1073741502' -or $env:VIA000_EXIT_UNSIGNED -cne '3221225794' -or
              $env:VIA000_EXIT_HEX -cne '0xC0000142' -or $env:VIA000_SENTINEL_PRESENT -cne 'false') {
            throw 'exact proof baseline did not reproduce reviewed STATUS_DLL_INIT_FAILED with complete teardown'
          }

