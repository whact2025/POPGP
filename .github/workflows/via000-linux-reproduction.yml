name: VIA-000 Linux reproduction

on:
  workflow_dispatch:
  push:
    branches:
      - campaign/via000-runner-1

permissions:
  contents: read

jobs:
  via000-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out attacked campaign handoff
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          path: control

      - name: Check out exact scientific candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          path: candidate
          ref: 9a29e05f803666bf0e3a28417ea399e3e26769fc

      - name: Set up base Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Set up exact TeX Live 2026
        uses: TeX-Live/setup-texlive-action@eb78d21f41941476d9121e3a0abcab73265c876f
        with:
          version: "2026"
          cache: "false"
          packages: >-
            scheme-small revtex amsmath graphics hyperref tools booktabs ec

      - name: Install exact uv runner
        run: python -m pip install --disable-pip-version-check uv==0.11.11

      - name: Verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "9a29e05f803666bf0e3a28417ea399e3e26769fc"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "358fb1af6ca587b6c71ff2ef0fb87e335163eeaf"
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=normal --ignored)"
          pdflatex --version
          uv --version
          python --version

      - name: Execute exact VIA-000 protocol and mutations
        shell: bash
        run: |
          set -euo pipefail
          python -I \
            control/reviews/viability/POPGP-VIABILITY-R1-2026-08/runner/run_via000_protocol.py \
            --candidate candidate \
            --output control/reviews/viability/POPGP-VIABILITY-R1-2026-08/receipts/VIA-000/runner/linux \
            --platform-family ubuntu-latest-x86_64 \
            --uv-cache "$RUNNER_TEMP/via000-uv-cache" \
            --mutation-only

      - name: Upload immutable Linux evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: via000-linux-evidence
          path: control/reviews/viability/POPGP-VIABILITY-R1-2026-08/receipts/VIA-000/runner/linux
          if-no-files-found: error
          retention-days: 90
